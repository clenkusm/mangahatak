<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة القصص الشاملة</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #ddd;
            --sidebar-hover: #e9ecef;
            --input-bg: #fff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --sidebar-hover: #2c2c2c;
            --input-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .sidebar-menu li:hover, .sidebar-menu li.active {
            background-color: var(--sidebar-hover);
            color: #3498db;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            background-color: var(--card-bg);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .view-container {
            padding: 30px;
            flex: 1;
        }

        /* Buttons & Inputs */
        .btn-primary { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-submit { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-warning { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .icon-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
        }

        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .story-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .story-img-icon {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Chat */
        .chat-container { display: flex; height: 75vh; border: 1px solid var(--border-color); border-radius: 10px; background: var(--card-bg); overflow: hidden; }
        .chat-sidebar { width: 280px; border-left: 1px solid var(--border-color); overflow-y: auto; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 70%; word-break: break-word; }
        .msg.sent { background: #3498db; color: white; align-self: flex-end; }
        .msg.received { background: var(--sidebar-hover); align-self: flex-start; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .user-dot-menu { position: absolute; top: 10px; left: 10px; cursor: pointer; font-weight: bold; background: rgba(0,0,0,0.5); color: #fff; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #3498db; }
    </style>
</head>
<body data-theme="light">

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div>
            <h2>📚 منصة القصص</h2>
            <ul class="sidebar-menu" style="margin-top: 30px;">
                <li onclick="switchPage('home')" id="menu-home" class="active">🏠 الرئيسية</li>
                <li onclick="switchPage('add')" id="menu-add">✍️ كتابة قصة</li>
                <li onclick="switchPage('lists')" id="menu-lists">📑 القوائم</li>
                <li onclick="switchPage('chat')" id="menu-chat">💬 المحادثات والأصدقاء</li>
                <li onclick="switchPage('account')" id="menu-account">👤 الحساب</li>
            </ul>
        </div>
        <div>
            <button class="icon-btn" onclick="toggleTheme()" style="width:100%; margin-bottom: 10px;" id="themeBtn">🌙 الوضع الداكن</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="header">
            <h3 id="pageTitle">الرئيسية</h3>
            <div style="display:flex; gap:15px; align-items:center;">
                <span id="notificationBell" style="cursor:pointer; position:relative;" onclick="openNotificationsModal()">🔔<span id="notifBadge" style="position:absolute; top:-5px; right:-10px; background:red; color:white; border-radius:50%; font-size:10px; padding:2px 5px; display:none;">0</span></span>
                <span id="headerUserName">المستخدم</span>
            </div>
        </div>
        <div class="view-container" id="mainView"></div>
    </div>

    <!-- مودال عام منبثق -->
    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // إدارة البيانات الأساسية مع التخزين المحلي
        let appData = JSON.parse(localStorage.getItem('appData')) || {
            theme: 'light',
            currentUser: {
                name: "كاتب مبدع",
                image: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100",
                status: "مبتدئ",
                friends: [],
                friendRequests: {},
                favorites: [],
                read: [],
                uncompleted: []
            },
            stories: [],
            lists: [],
            chats: [
                { name: "المجموعة العامة", type: "group", messages: [], members: [] }
            ],
            notifications: [],
            usersList: []
        };

        function saveToLocalStorage() {
            localStorage.setItem('appData', JSON.stringify(appData));
        }

        // دوال مساعدة لرفع الملفات والصور من الجهاز (Base64)
        function readFileAsBase64(fileInputId, callback) {
            const fileInput = document.getElementById(fileInputId);
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    callback(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                callback(null);
            }
        }

        function readDocumentFile(fileInputId, callback) {
            const fileInput = document.getElementById(fileInputId);
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    callback({ name: file.name, data: e.target.result });
                };
                reader.readAsDataURL(file);
            } else {
                callback(null);
            }
        }

        // إعدادات الوضع الداكن
        if(appData.theme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').innerText = '☀️ الوضع الفاتح';
        }

        function toggleTheme() {
            if(document.body.getAttribute('data-theme') === 'light') {
                document.body.setAttribute('data-theme', 'dark');
                appData.theme = 'dark';
                document.getElementById('themeBtn').innerText = '☀️ الوضع الفاتح';
            } else {
                document.body.setAttribute('data-theme', 'light');
                appData.theme = 'light';
                document.getElementById('themeBtn').innerText = '🌙 الوضع الداكن';
            }
            saveToLocalStorage();
        }

        document.getElementById('headerUserName').innerText = appData.currentUser.name;

        function switchPage(page) {
            document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
            if(document.getElementById('menu-' + page)) {
                document.getElementById('menu-' + page).classList.add('active');
            }

            if(page === 'home') renderHome();
            else if(page === 'add') renderAddStory();
            else if(page === 'lists') renderLists();
            else if(page === 'chat') renderChat();
            else if(page === 'account') renderAccount();
        }

        // الصفحة الرئيسية
        function renderHome() {
            document.getElementById('pageTitle').innerText = "الرئيسية - القصص المتاحة للجميع";
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                    <input type="text" id="searchBox" placeholder="🔍 ابحث عن قصة..." oninput="filterStories()" style="max-width:300px; margin:0;">
                    <select id="catFilter" onchange="filterStories()" style="max-width:150px; margin:0;">
                        <option value="">جميع التصنيفات</option>
                        <option>دراما</option><option>رومانسي</option><option>تشونين</option><option>غموض</option><option>رعب</option>
                    </select>
                </div>
                <div class="grid" id="storiesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'storiesGrid');
        }

        function filterStories() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let cat = document.getElementById('catFilter').value;
            let filtered = appData.stories.filter(s => {
                let matchTitle = s.title.toLowerCase().includes(query);
                let matchCat = cat === "" || s.category === cat;
                return matchTitle && matchCat;
            });
            renderStoriesList(filtered, 'storiesGrid');
        }

        // صفحة إضافة قصة جديدة
        function renderAddStory() {
            document.getElementById('pageTitle').innerText = "✍️ كتابة ونشر قصة جديدة";
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div style="background:var(--card-bg); padding:30px; border-radius:10px; border:1px solid var(--border-color); max-width:600px; margin:auto;">
                    <div class="form-group"><label>عنوان القصة</label><input type="text" id="stName"></div>
                    <div class="form-group"><label>صورة القصة من الجهاز</label><input type="file" id="stImgFile" accept="image/*"></div>
                    <div class="form-group"><label>ملف القصة (PDF أو Word) - اختيارى</label><input type="file" id="stDocFile" accept=".pdf,.doc,.docx"></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat">
                            <option>دراما</option><option>رومانسي</option><option>تشونين</option><option>غموض</option><option>رعب</option>
                        </select>
                    </div>
                    <div class="form-group"><label>محتوى القصة</label><textarea id="stText" rows="6"></textarea></div>
                    <button class="btn-submit" onclick="saveNewStory()">🚀 نشر للجميع</button>
                </div>
            `;
        }

        function saveNewStory() {
            let title = document.getElementById('stName').value;
            let text = document.getElementById('stText').value;
            let category = document.getElementById('stCat').value;

            if(!title || !text) { alert("يرجى ملء حقول العنوان والمحتوى على الأقل."); return; }

            readFileAsBase64('stImgFile', function(imgBase64) {
                readDocumentFile('stDocFile', function(docFile) {
                    let newStory = {
                        id: Date.now(),
                        title: title,
                        image: imgBase64 || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=100',
                        document: docFile,
                        text: text,
                        category: category,
                        author: appData.currentUser.name,
                        stars: 0,
                        likes: 0,
                        dislikes: 0,
                        reads: 0,
                        comments: [],
                        ratingsList: {},
                        likedByUsers: [],
                        dislikedByUsers: []
                    };

                    appData.stories.push(newStory);
                    saveToLocalStorage();
                    alert("✅ تمت إضافة القصة ونشرها لكل المستخدمين بنجاح!");
                    switchPage('home');
                });
            });
        }

        // صفحة القوائم (Lists) مع دعم الصور والملفات
        function renderLists() {
            document.getElementById('pageTitle').innerText = "📑 قوائم القصص والأجزاء";
            const view = document.getElementById('mainView');
            let listsHTML = "";
            appData.lists.forEach((l, idx) => {
                let listStories = l.stories.map(s => `<li style="margin:5px 0;"><span style="color:#3498db; cursor:pointer;" onclick="openStoryDetail(${s.id})">📖 ${s.title}</span></li>`).join('');
                listsHTML += `
                    <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:10px; padding:20px; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
                        <img src="${l.image || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=100'}" style="width:70px; height:70px; border-radius:8px; object-fit:cover;">
                        <div style="flex:1;">
                            <h3>📑 ${l.name}</h3>
                            <ul style="list-style:none; padding:0; margin-top:5px;">${listStories || '<p style="font-size:12px; color:#777;">لا توجد قصص في هذه القائمة.</p>'}</ul>
                        </div>
                        <button class="btn-primary" style="padding:5px 10px; font-size:12px;" onclick="addStoryToListModal('${l.name}')">➕ إضافة قصة</button>
                    </div>
                `;
            });
            if(!listsHTML) listsHTML = "<p>لا توجد قوائم حالياً.</p>";

            view.innerHTML = `
                <button class="btn-submit" onclick="createListModal()">➕ إنشاء قائمة جديدة</button><br><br>
                ${listsHTML}
            `;
        }

        function createListModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <h3>📑 إنشاء قائمة جديدة</h3><br>
                <div class="form-group"><label>اسم القائمة</label><input type="text" id="newListName"></div>
                <div class="form-group"><label>صورة القائمة من الجهاز</label><input type="file" id="newListImg" accept="image/*"></div>
                <button class="btn-submit" onclick="confirmCreateList()">✅ إنشاء</button>
                <button class="btn-danger" style="margin-top:10px; width:100%; justify-content:center;" onclick="closeModal()">❌ إلغاء</button>
            `;
        }

        function confirmCreateList() {
            let name = document.getElementById('newListName').value;
            if(!name) { alert("أدخل اسم القائمة"); return; }
            readFileAsBase64('newListImg', function(base64Img) {
                appData.lists.push({
                    name: name,
                    image: base64Img || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=100',
                    stories: []
                });
                saveToLocalStorage();
                closeModal();
                renderLists();
            });
        }

        function addStoryToListModal(listName) {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            let options = appData.stories.map(s => `<option value="${s.id}">${s.title}</option>`).join('');
            body.innerHTML = `
                <h3>➕ إضافة قصة إلى (${listName})</h3><br>
                <div class="form-group"><label>اختر قصة</label><select id="storySelectForList">${options}</select></div>
                <button class="btn-submit" onclick="confirmAddStoryToList('${listName}')">✅ إضافة</button>
                <button class="btn-danger" style="margin-top:10px; width:100%; justify-content:center;" onclick="closeModal()">❌ إلغاء</button>
            `;
        }

        function confirmAddStoryToList(listName) {
            let storyId = parseInt(document.getElementById('storySelectForList').value);
            let story = appData.stories.find(s => s.id === storyId);
            let listObj = appData.lists.find(l => l.name === listName);
            if(story && listObj) {
                if(!listObj.stories.some(s => s.id === storyId)) {
                    story.listName = listName;
                    listObj.stories.push(story);
                    saveToLocalStorage();
                    alert("✅ تمت إضافة القصة للقائمة بنجاح!");
                } else {
                    alert("⚠️ القصة موجودة بالفعل في هذه القائمة.");
                }
            }
            closeModal();
            renderLists();
        }

        // تفاصيل القصة والتفاعلات (زر واحد لكل تفاعل وتعديل التقييم)
        function openStoryDetail(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!story) return;
            const view = document.getElementById('mainView');

            let isFav = appData.currentUser.favorites.some(s => s.id === id);
            let isRead = appData.currentUser.read.some(s => s.id === id);

            let docDownloadHTML = "";
            if(story.document) {
                docDownloadHTML = `<div style="margin-top:15px;"><a href="${story.document.data}" download="${story.document.name}" class="btn-primary" style="text-decoration:none; display:inline-block;">📥 تحميل ملف القصة (${story.document.name})</a></div>`;
            }

            let commentsHTML = story.comments.map(c => `<div style="padding:8px; background:var(--input-bg); border-radius:5px; margin-bottom:5px;"><b>👤 ${c.user}:</b> ${c.text}</div>`).join('') || "<p style='color:#777; font-size:13px;'>لا توجد تعليقات بعد.</p>";

            let user = appData.currentUser.name;
            let likedActive = story.likedByUsers && story.likedByUsers.includes(user);
            let dislikedActive = story.dislikedByUsers && story.dislikedByUsers.includes(user);

            view.innerHTML = `
                <button class="icon-btn" onclick="switchPage('home')">⬅ رجوع</button><br><br>
                <div style="background:var(--card-bg); padding:30px; border-radius:10px; border:1px solid var(--border-color); position:relative;">
                    <img src="${story.image}" style="width:90px; height:90px; border-radius:10px; object-fit:cover; float:right; margin-left:20px; border:2px solid var(--border-color);">
                    <h2>${story.title}</h2>
                    <p style="color:#777; margin:10px 0;">✍️ المؤلف: <span style="color:#3498db;">${story.author}</span> | 🏷️ التصنيف: ${story.category}</p>
                    <p style="font-size:16px; color:#f39c12; margin-bottom:15px;">⭐ ${story.stars} | 👁️ ${story.reads} قراءة</p>
                    <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
                        <button class="icon-btn" onclick="toggleLike(${story.id})" style="${likedActive ? 'background:#3498db; color:white;' : ''}">👍 إعجاب (${story.likes})</button>
                        <button class="icon-btn" onclick="toggleDislike(${story.id})" style="${dislikedActive ? 'background:#e74c3c; color:white;' : ''}">👎 عدم إعجاب (${story.dislikes})</button>
                        <button class="icon-btn" onclick="openRatingModal(${story.id})">⭐ تقييم من 5</button>
                    </div>
                    <hr style="margin:15px 0; border-color:var(--border-color);"><br>
                    <p style="line-height:1.6; margin-bottom:20px; white-space: pre-wrap;">${story.text}</p>
                    ${docDownloadHTML}
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn-primary" id="favBtn" onclick="toggleFav(${story.id})">⭐ ${isFav ? 'تم (المفضلة)' : 'إضافة للمفضلة'}</button>
                        <button class="btn-submit" id="readBtn" onclick="toggleRead(${story.id})">📖 ${isRead ? 'تم (مقروءة)' : 'تم القراءة'}</button>
                    </div>
                    <hr style="margin:25px 0; border-color:var(--border-color);">
                    <h3>💬 التعليقات</h3>
                    <div style="margin-top:15px; max-height:200px; overflow-y:auto; margin-bottom:15px;">${commentsHTML}</div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="commentInput" placeholder="✍️ اكتب تعليقك..." style="flex:1; margin:0;">
                        <button class="btn-primary" onclick="addComment(${story.id})">💬 تعليق</button>
                    </div>
                </div>
            `;
            story.reads++;
            saveToLocalStorage();
        }

        function toggleLike(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!story) return;
            if(!story.likedByUsers) story.likedByUsers = [];
            if(!story.dislikedByUsers) story.dislikedByUsers = [];
            let user = appData.currentUser.name;

            if(story.likedByUsers.includes(user)) {
                story.likedByUsers = story.likedByUsers.filter(u => u !== user);
                story.likes--;
            } else {
                story.likedByUsers.push(user);
                story.likes++;
                if(story.dislikedByUsers.includes(user)) {
                    story.dislikedByUsers = story.dislikedByUsers.filter(u => u !== user);
                    story.dislikes--;
                }
            }
            saveToLocalStorage();
            openStoryDetail(id);
        }

        function toggleDislike(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!story) return;
            if(!story.likedByUsers) story.likedByUsers = [];
            if(!story.dislikedByUsers) story.dislikedByUsers = [];
            let user = appData.currentUser.name;

            if(story.dislikedByUsers.includes(user)) {
                story.dislikedByUsers = story.dislikedByUsers.filter(u => u !== user);
                story.dislikes--;
            } else {
                story.dislikedByUsers.push(user);
                story.dislikes++;
                if(story.likedByUsers.includes(user)) {
                    story.likedByUsers = story.likedByUsers.filter(u => u !== user);
                    story.likes--;
                }
            }
            saveToLocalStorage();
            openStoryDetail(id);
        }

        function openRatingModal(id) {
            let story = appData.stories.find(s => s.id === id);
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <h3>⭐ تقييم القصة: ${story.title}</h3><br>
                <div style="display:flex; justify-content:center; gap:10px; font-size:24px; margin-bottom:20px; cursor:pointer;">
                    <span onclick="rateStory(${id}, 1)">⭐</span>
                    <span onclick="rateStory(${id}, 2)">⭐⭐</span>
                    <span onclick="rateStory(${id}, 3)">⭐⭐⭐</span>
                    <span onclick="rateStory(${id}, 4)">⭐⭐⭐⭐</span>
                    <span onclick="rateStory(${id}, 5)">⭐⭐⭐⭐⭐</span>
                </div>
                <button class="btn-danger" style="width:100%; justify-content:center;" onclick="closeModal()">❌ إلغاء</button>
            `;
        }

        function rateStory(id, val) {
            let story = appData.stories.find(s => s.id === id);
            if(!story.ratingsList) story.ratingsList = {};
            let user = appData.currentUser.name;

            // تحديث أو تسجيل التقييم القديم للمستخدم مباشرة
            story.ratingsList[user] = val;

            let ratingsArr = Object.values(story.ratingsList);
            let sum = ratingsArr.reduce((a, b) => a + b, 0);
            story.stars = parseFloat((sum / ratingsArr.length).toFixed(1));

            saveToLocalStorage();
            alert(`✅ تم تعديل/حفظ تقييمك (${val} نجوم) بنجاح!`);
            closeModal();
            openStoryDetail(id);
        }

        function toggleFav(id) {
            let story = appData.stories.find(s => s.id === id);
            let idx = appData.currentUser.favorites.findIndex(s => s.id === id);
            let btn = document.getElementById('favBtn');
            if(idx > -1) {
                appData.currentUser.favorites.splice(idx, 1);
                btn.innerText = '⭐ إضافة للمفضلة';
            } else {
                appData.currentUser.favorites.push(story);
                btn.innerText = '⭐ تم (المفضلة)';
            }
            saveToLocalStorage();
        }

        function toggleRead(id) {
            let story = appData.stories.find(s => s.id === id);
            let idx = appData.currentUser.read.findIndex(s => s.id === id);
            let btn = document.getElementById('readBtn');
            if(idx > -1) {
                appData.currentUser.read.splice(idx, 1);
                btn.innerText = '📖 تم القراءة';
            } else {
                appData.currentUser.read.push(story);
                btn.innerText = '📖 تم (مقروءة)';
            }
            saveToLocalStorage();
        }

        function addComment(id) {
            let story = appData.stories.find(s => s.id === id);
            let input = document.getElementById('commentInput');
            if(!input.value) return;
            story.comments.push({ user: appData.currentUser.name, text: input.value });
            input.value = "";
            saveToLocalStorage();
            openStoryDetail(id);
        }

        function renderStoriesList(storiesArray, elementId) {
            const grid = document.getElementById(elementId);
            if(!grid) return;
            grid.innerHTML = "";
            if(storiesArray.length === 0) {
                grid.innerHTML = "<p>لا توجد قصص لعرضها.</p>";
                return;
            }
            storiesArray.forEach(story => {
                grid.innerHTML += `
                    <div class="story-card" onclick="openStoryDetail(${story.id})">
                        <img src="${story.image}" class="story-img-icon">
                        <h4 style="margin-top:8px;">${story.title}</h4>
                        <p style="font-size:11px; color:#777; margin-top:3px;">✍️ ${story.author}</p>
                        <p style="font-size:12px; color:#f39c12; margin-top:5px;">⭐ ${story.stars} | 👍 ${story.likes}</p>
                    </div>
                `;
            });
        }

        // صفحة المحادثات
        function renderChat() {
            document.getElementById('pageTitle').innerText = "💬 الدردشة والمحادثات الجماعية";
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="chat-container">
                    <div class="chat-sidebar">
                        <div style="padding:15px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                            <h4>💬 المحادثات</h4>
                        </div>
                        <div style="padding:10px; cursor:pointer; background:var(--sidebar-hover);" onclick="openChat('المجموعة العامة')">🌐 المجموعة العامة</div>
                    </div>
                    <div class="chat-main">
                        <div style="padding:15px; border-bottom:1px solid var(--border-color); font-weight:bold;" id="activeChatTitle">🌐 المجموعة العامة</div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="msgInput" placeholder="✍️ اكتب رسالتك..." style="margin:0;">
                            <button class="btn-primary" onclick="sendMessage()">🚀 إرسال</button>
                        </div>
                    </div>
                </div>
            `;
            openChat("المجموعة العامة");
        }

        let currentActiveChat = "المجموعة العامة";
        function openChat(chatName) {
            currentActiveChat = chatName;
            document.getElementById('activeChatTitle').innerText = `💬 ${chatName}`;
            let chat = appData.chats.find(c => c.name === chatName);
            let container = document.getElementById('chatMessages');
            container.innerHTML = "";
            if(chat) {
                chat.messages.forEach(m => {
                    let isMe = m.sender === appData.currentUser.name;
                    container.innerHTML += `<div class="msg ${isMe ? 'sent' : 'received'}"><b>${m.sender}:</b> ${m.text}</div>`;
                });
            }
        }

        function sendMessage() {
            let input = document.getElementById('msgInput');
            if(!input.value) return;
            let chat = appData.chats.find(c => c.name === currentActiveChat);
            if(chat) {
                chat.messages.push({ sender: appData.currentUser.name, text: input.value });
                input.value = "";
                saveToLocalStorage();
                openChat(currentActiveChat);
            }
        }

        // صفحة الحساب (مع رفع صورة الحساب من الجهاز)
        function renderAccount() {
            document.getElementById('pageTitle').innerText = "👤 ملف المستخدم الشخصي";
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div style="background:var(--card-bg); padding:30px; border-radius:10px; border:1px solid var(--border-color); max-width:500px; margin:auto; text-align:center;">
                    <img src="${appData.currentUser.image}" class="user-avatar-preview" style="margin-bottom:15px;">
                    <h3>${appData.currentUser.name}</h3>
                    <p style="color:#777; margin:10px 0;">🏷️ الحالة: ${appData.currentUser.status}</p>
                    <button class="btn-primary" onclick="editAccountModal()" style="margin-top:15px;">✏️ تعديل الحساب</button>
                </div>
            `;
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <h3>✏️ تعديل الحساب</h3><br>
                <div class="form-group"><label>اسم الحساب الجديد</label><input type="text" id="newName" value="${appData.currentUser.name}"></div>
                <div class="form-group"><label>صورة الحساب الجديدة من الجهاز</label><input type="file" id="newImgFile" accept="image/*"></div>
                <button class="btn-submit" onclick="saveAccountEdit()">💾 حفظ التعديلات</button>
                <button class="btn-danger" style="margin-top:10px; width:100%; justify-content:center;" onclick="closeModal()">❌ إلغاء</button>
            `;
        }

        function saveAccountEdit() {
            let name = document.getElementById('newName').value;
            readFileAsBase64('newImgFile', function(base64Img) {
                appData.currentUser.name = name;
                if(base64Img) {
                    appData.currentUser.image = base64Img;
                }
                saveToLocalStorage();
                document.getElementById('headerUserName').innerText = appData.currentUser.name;
                closeModal();
                renderAccount();
            });
        }

        function closeModal() {
            document.getElementById('globalModal').style.display = 'none';
        }

        function openNotificationsModal() {
            alert("لا توجد إشعارات جديدة.");
        }

        // التشغيل التلقائي عند فتح الصفحة
        switchPage('home');
    </script>
</body>
</html>
