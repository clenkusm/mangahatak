<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانجاهاتك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; transition: background 0.3s, color 0.3s; }
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #bdc3c7;
            --sidebar-hover: #34495e;
            --card-bg: #fff;
            --topbar-bg: #fff;
            --border-color: #ddd;
            --chat-bg: #f9f9f9;
        }
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #aaa;
            --sidebar-hover: #2c2c2c;
            --card-bg: #1e1e1e;
            --topbar-bg: #1e1e1e;
            --border-color: #333;
            --chat-bg: #181818;
        }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 20px; position: fixed; right: 0; top: 0; height: 100%; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 20px; font-weight: bold; color: #fff; }
        .nav-links { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .nav-links a { color: var(--sidebar-text); text-decoration: none; padding: 12px; border-radius: 8px; transition: 0.3s; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { background: var(--sidebar-hover); color: #fff; }
        .theme-toggle-area { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .main-content { margin-right: 260px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: var(--topbar-bg); padding: 15px 30px; display: flex; justify-content: flex-end; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
        .icon-btn { background: var(--sidebar-hover); color: var(--text-color); border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .page-body { padding: 30px; }
        .hero { background: linear-gradient(135deg, #3498db, #2c3e50); color: white; padding: 40px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-container { background: var(--card-bg); padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 650px; margin: auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .story-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; text-align: center; cursor: pointer; border: 1px solid var(--border-color); }
        .story-icon-box { width: 100%; height: 150px; background: #e2e8f0; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .chat-container { display: flex; height: calc(100vh - 140px); background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-sidebar { width: 300px; border-left: 1px solid var(--border-color); overflow-y: auto; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: var(--chat-bg); display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 60%; }
        .msg.sent { background: #27ae60; color: white; align-self: flex-end; }
        .msg.received { background: var(--card-bg); align-self: flex-start; border: 1px solid var(--border-color); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: var(--card-bg); color: var(--text-color); padding: 30px; border-radius: 10px; width: 400px; max-width: 90%; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <span>📖</span>
            <h2>مانجاهاتك</h2>
        </div>
        <nav class="nav-links">
            <a class="active" onclick="switchPage('home', this)"><span>🏠</span> الصفحة الرئيسية</a>
            <a onclick="switchPage('search', this)"><span>🔍</span> البحث</a>
            <a onclick="switchPage('topRated', this)"><span>⭐</span> الأعلى تقييما</a>
            <a onclick="switchPage('chat', this)"><span>💬</span> المحادثات</a>
            <a onclick="switchPage('addStory', this)"><span>➕</span> اضافة قصة</a>
            <a onclick="switchPage('account', this)"><span>👤</span> الحساب</a>
        </nav>
        <div class="theme-toggle-area">
            <a onclick="toggleTheme()" id="themeToggleBtn"><span>🌙</span> الوضع المظلم</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <button class="icon-btn" onclick="openNotifications()">🔔 الإشعارات <span id="notifCount" style="color:red;">(0)</span></button>
            <button class="icon-btn" onclick="openFriendsListModal()">👥 الأصدقاء</button>
        </header>

        <div class="page-body" id="mainView"></div>
    </div>

    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let appData = {
            currentUser: { name: "مستخدم ضيف", type: "guest", friends: [], stories: [], favorites: [], uncompleted: [], following: [], read: [], friendRequestsSent: [] },
            stories: [
                { id: 1, title: "رحلة الفانتازيا الكبرى", author: "أحمد محمد", category: "فانتازيا", privacy: "عامة", text: "هذه قصة خيالية ممتعة...", likes: 120, stars: 4.8, reads: 540, comments: 15, listName: "سلسلة الفانتازيا" },
                { id: 2, title: "أسرار الظلام والأكشن", author: "محمود علي", category: "أكشن", privacy: "عامة", text: "قصة مليئة بالحماس...", likes: 95, stars: 4.2, reads: 320, comments: 8, listName: "" }
            ],
            lists: [
                { name: "سلسلة الفانتازيا", stories: [{ id: 1, title: "رحلة الفانتازيا الكبرى" }, { id: 101, title: "رحلة الفانتازيا - الجزء الثاني" }] }
            ],
            notifications: [],
            chats: [{ id: 1, name: "المجموعة العامة", type: "group", members: ["مستخدم ضيف", "أحمد محمد", "محمود علي"], messages: [{sender: "أحمد", text: "أهلاً بالجميع!"}] }],
            usersDirectory: [
                { name: "أحمد محمد", friendStatus: "none" },
                { name: "محمود علي", friendStatus: "friend" }
            ]
        };

        window.onload = function() { renderHome(); };

        function switchPage(pageName, element) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');
            if(pageName === 'home') renderHome();
            else if(pageName === 'search') renderSearch();
            else if(pageName === 'topRated') renderTopRated();
            else if(pageName === 'chat') renderChat();
            else if(pageName === 'addStory') renderAddStory();
            else if(pageName === 'account') renderAccount();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeToggleBtn');
            if(document.body.classList.contains('dark-mode')) {
                btn.innerHTML = '<span>☀️</span> الوضع المضيء';
            } else {
                btn.innerHTML = '<span>🌙</span> الوضع المظلم';
            }
        }

        function renderHome() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="hero">
                    <h1>أهلاً بك في مانجاهاتك</h1>
                    <p>منصتك الأولى لرفع وقراءة أمتع القصص والروايات</p>
                </div>
                <div class="cards-grid">
                    <div class="card" onclick="switchPage('addStory')"><h3>أنشئ كتابك الخاص</h3><p>شارك إبداعك مع العالم</p></div>
                    <div class="card" onclick="switchPage('search')"><h3>ابحث عن أشهر القصص</h3><p>استكشف ملايين العناوين</p></div>
                    <div class="card" onclick="switchPage('topRated')"><h3>استمتع بأمتع القصص</h3><p>الأعلى تقييماً وقراءةً</p></div>
                </div>
                <h3 style="margin-bottom: 15px;">قصص مقترحة لك</h3>
                <div class="stories-grid" id="homeStoriesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'homeStoriesGrid');
        }

        function renderAddStory() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="form-container">
                    <h2>اضافة قصة جديدة</h2><br>
                    <div class="form-group"><label>اسم القصة (إجباري)</label><input type="text" id="stName"></div>
                    <div class="form-group"><label>نص القصة (إجباري)</label><textarea rows="4" id="stText" placeholder="اكتب القصة هنا..."></textarea></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat">
                            <option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option><option>تشونين</option><option>غموض</option><option>رعب</option>
                        </select>
                    </div>
                    <div class="form-group"><label>الخصوصية</label>
                        <select id="stPrivacy">
                            <option value="عامة">عامة</option><option value="خاصة">خاصة</option><option value="للاصدقاء فقط">للاصدقاء فقط</option>
                        </select>
                    </div>
                    <div class="form-group"><label>اسم القائمة (List) المرتبطة (اختياري)</label><input type="text" id="stList"></div>
                    <button class="btn-submit" onclick="submitStory()">نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const cat = document.getElementById('stCat').value;
            const privacy = document.getElementById('stPrivacy').value;
            const listName = document.getElementById('stList').value;

            if(!name || !text) {
                alert("خطأ: يجب ملء جميع الخانات الأساسية (اسم القصة ونصها)!");
                return;
            }

            const newStory = {
                id: appData.stories.length + 1,
                title: name,
                author: appData.currentUser.name,
                category: cat,
                privacy: privacy,
                text: text,
                likes: 0,
                stars: 5.0,
                reads: 1,
                comments: 0,
                listName: listName
            };

            appData.stories.push(newStory);
            appData.currentUser.stories.push(newStory);

            if(listName) {
                let existingList = appData.lists.find(l => l.name === listName);
                if(existingList) {
                    existingList.stories.push(newStory);
                } else {
                    appData.lists.push({ name: listName, stories: [newStory] });
                }
            }

            alert("تم نشر القصة بنجاح!");
            switchPage('home');
        }

        function renderSearch() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="form-container" style="max-width:100%; margin-bottom:20px;">
                    <input type="text" id="searchInput" placeholder="ابحث عن اسم القصة أو المستخدم..." onkeyup="filterStories()" style="padding:15px; font-size:16px;">
                </div>
                <div class="stories-grid" id="searchGrid"></div>
            `;
            renderStoriesList(appData.stories, 'searchGrid');
        }

        function filterStories() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = appData.stories.filter(s => s.title.toLowerCase().includes(query) || s.author.toLowerCase().includes(query));
            renderStoriesList(filtered, 'searchGrid');
        }

        function renderTopRated() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <h2>القصص الأعلى تقييماً</h2><br>
                <div class="stories-grid" id="topGrid"></div>
            `;
            let sorted = [...appData.stories].sort((a,b) => (b.likes * b.stars) - (a.likes * a.stars));
            renderStoriesList(sorted, 'topGrid');
        }

        function renderAccount() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div style="background:var(--card-bg); padding:20px; border-radius:10px; display:flex; align-items:center; gap:20px; margin-bottom:20px; border:1px solid var(--border-color);">
                    <div style="width:80px; height:80px; border-radius:50%; background:#3498db; display:flex; align-items:center; justify-content:center; font-size:40px;">📖</div>
                    <div>
                        <h2>${appData.currentUser.name}</h2>
                        <p>نوع الحساب: ${appData.currentUser.type}</p>
                    </div>
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
                    <button class="icon-btn" onclick="showAccountTab('stories')">قصصي</button>
                    <button class="icon-btn" onclick="showAccountTab('favorites')">قصص مفضلة</button>
                    <button class="icon-btn" onclick="showAccountTab('friendsStories')">قصص الأصدقاء</button>
                    <button class="icon-btn" onclick="showAccountTab('seriesList')">قائمة أجزاء القصة</button>
                    <button class="icon-btn" onclick="showAccountTab('uncompleted')">لم يتم تكملتها</button>
                </div>
                <div id="accountTabContent"></div>
            `;
            showAccountTab('stories');
        }

        function showAccountTab(tab) {
            const container = document.getElementById('accountTabContent');
            if(tab === 'stories') {
                container.innerHTML = `<h3>قصصي</h3><br><div class="stories-grid" id="accStories"></div>`;
                renderStoriesList(appData.currentUser.stories, 'accStories');
            } else if(tab === 'favorites') {
                container.innerHTML = `<h3>القصص المفضلة</h3><br><div class="stories-grid" id="accFav"></div>`;
                renderStoriesList(appData.currentUser.favorites, 'accFav');
            } else if(tab === 'friendsStories') {
                container.innerHTML = `<h3>قصص الأصدقاء</h3><br><div class="stories-grid" id="accFriendsStories"></div>`;
                let friendsStories = appData.stories.filter(s => s.author !== appData.currentUser.name);
                renderStoriesList(friendsStories, 'accFriendsStories');
            } else if(tab === 'seriesList') {
                container.innerHTML = `<h3>سلسلة الأجزاء واللوائح المتاحة</h3><br>`;
                if(appData.lists.length === 0) {
                    container.innerHTML += `<p>لا توجد قوائم مرتبطة حالياً.</p>`;
                } else {
                    appData.lists.forEach(l => {
                        container.innerHTML += `<h4>${l.name}</h4>`;
                        let listGridId = 'list_' + Math.random().toString(36).substring(7);
                        container.innerHTML += `<div class="stories-grid" id="${listGridId}" style="margin:10px 0 20px 0;"></div>`;
                        setTimeout(() => renderStoriesList(l.stories, listGridId), 50);
                    });
                }
            } else if(tab === 'uncompleted') {
                container.innerHTML = `<h3>قصص لم يتم تكملتها</h3><br><div class="stories-grid" id="accUnc"></div>`;
                renderStoriesList(appData.currentUser.uncompleted, 'accUnc');
            }
        }

        function renderChat() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="chat-container">
                    <div class="chat-sidebar">
                        <div style="padding:15px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                            <h4>المحادثات</h4>
                            <button class="icon-btn" onclick="createGroupModal()">+ مجموعة</button>
                        </div>
                        <div id="chatListContainer"></div>
                    </div>
                    <div class="chat-main">
                        <div style="padding:15px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                            <span id="activeChatTitle" style="font-weight:bold;">اختر مجموعة</span>
                            <button class="btn-danger" id="leaveGroupBtn" style="display:none; padding:5px 10px; font-size:12px;" onclick="leaveCurrentGroup()">مغادرة المجموعة</button>
                        </div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
                            <button class="btn-primary" onclick="sendMessage()">إرسال</button>
                        </div>
                    </div>
                </div>
            `;
            renderChatList();
        }

        let currentActiveChatId = null;

        function renderChatList() {
            let container = document.getElementById('chatListContainer');
            if(!container) return;
            container.innerHTML = "";
            appData.chats.forEach(chat => {
                container.innerHTML += `<div style="padding:12px; cursor:pointer; border-bottom:1px solid var(--border-color);" onclick="openChat(${chat.id})">💬 ${chat.name}</div>`;
            });
            if(appData.chats.length > 0 && !currentActiveChatId) {
                openChat(appData.chats[0].id);
            }
        }

        function openChat(chatId) {
            currentActiveChatId = chatId;
            let chat = appData.chats.find(c => c.id === chatId);
            document.getElementById('activeChatTitle').innerText = chat.name;
            let leaveBtn = document.getElementById('leaveGroupBtn');
            if(chat.type === 'group') leaveBtn.style.display = 'block';
            else leaveBtn.style.display = 'none';
            loadChatMessages(chatId);
        }

        function loadChatMessages(chatId) {
            let chat = appData.chats.find(c => c.id === chatId);
            let container = document.getElementById('chatMessages');
            container.innerHTML = "";
            if(chat) {
                chat.messages.forEach(m => {
                    let isMe = m.sender === appData.currentUser.name;
                    container.innerHTML += `<div class="msg ${isMe ? 'sent' : 'received'}"><b>${m.sender}:</b> ${m.text}</div>`;
                });
            }
        }

        function sendMessage() {
            let text = document.getElementById('msgInput').value;
            if(!text || !currentActiveChatId) return;
            let chat = appData.chats.find(c => c.id === currentActiveChatId);
            chat.messages.push({ sender: appData.currentUser.name, text: text });
            document.getElementById('msgInput').value = "";
            loadChatMessages(currentActiveChatId);
        }

        function leaveCurrentGroup() {
            if(!currentActiveChatId) return;
            appData.chats = appData.chats.filter(c => c.id !== currentActiveChatId);
            currentActiveChatId = null;
            alert("تمت مغادرة المجموعة بنجاح.");
            renderChat();
        }

        function createGroupModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <h3>إنشاء مجموعة جديدة</h3><br>
                <div class="form-group"><label>اسم المجموعة</label><input type="text" id="groupNameInput"></div>
                <div class="form-group"><label>حدد الأصدقاء للإضافة:</label>
                    <div id="friendsCheckboxes" style="max-height:150px; overflow-y:auto; border:1px solid var(--border-color); padding:10px; border-radius:5px;">
                        ${appData.currentUser.friends.length === 0 ? '<p>لا توجد أصدقاء حالياً</p>' : appData.currentUser.friends.map(f => `<label style="display:block; margin-bottom:5px;"><input type="checkbox" value="${f}" class="friend-chk"> ${f}</label>`).join('')}
                    </div>
                </div>
                <button class="btn-submit" onclick="confirmCreateGroup()">إنشاء</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="closeModal()">إلغاء</button>
            `;
        }

        function confirmCreateGroup() {
            let name = document.getElementById('groupNameInput').value;
            if(!name) { alert("أدخل اسم المجموعة"); return; }
            let selectedFriends = [];
            document.querySelectorAll('.friend-chk:checked').forEach(chk => selectedFriends.push(chk.value));
            
            let newGroup = {
                id: Date.now(),
                name: name,
                type: 'group',
                members: [appData.currentUser.name, ...selectedFriends],
                messages: [{ sender: "النظام", text: "تم إنشاء المجموعة بنجاح" }]
            };
            appData.chats.push(newGroup);
            closeModal();
            renderChat();
        }

        function renderStoriesList(storiesArray, elementId) {
            const grid = document.getElementById(elementId);
            if(!grid) return;
            grid.innerHTML = "";
            storiesArray.forEach(story => {
                grid.innerHTML += `
                    <div class="story-card" onclick="openStoryDetail(${story.id})">
                        <div class="story-icon-box">📖</div>
                        <h4>${story.title}</h4>
                        <p style="font-size:12px; color:#777;">الكاتب: ${story.author}</p>
                        <p style="font-size:12px; color:#f39c12;">⭐ ${story.stars} | 👍 ${story.likes}</p>
                    </div>
                `;
            });
        }

        function openStoryDetail(id) {
            let story = appData.stories.find(s => s.id === id);
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <button class="icon-btn" onclick="switchPage('home')">⬅ رجوع</button><br><br>
                <div style="background:var(--card-bg); padding:30px; border-radius:10px; border:1px solid var(--border-color);">
                    <div style="width:150px; height:200px; background:#e2e8f0; border-radius:8px; float:right; margin-left:20px; display:flex; align-items:center; justify-content:center; font-size:70px;">📖</div>
                    <h2>${story.title}</h2>
                    <p style="color:#777; margin:10px 0; cursor:pointer;" onclick="openUserProfile('${story.author}')">المؤلف: <u>${story.author}</u> | التصنيف: ${story.category}</p>
                    <p style="font-size:18px; color:#f39c12; margin-bottom:15px;">⭐ ${story.stars} | 👁️ ${story.reads} قراءة</p>
                    <hr style="margin:15px 0; border-color:var(--border-color);"><br>
                    <p style="line-height:1.6; margin-bottom:20px;">${story.text}</p>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-primary" onclick="addToFav(${story.id})">إضافة للمفضلة</button>
                        <button class="btn-submit" onclick="markAsUncompleted(${story.id})">أضف لـ (لم يتم تكملتها)</button>
                    </div>
                </div>
            `;
        }

        function openUserProfile(authorName) {
            let userObj = appData.usersDirectory.find(u => u.name === authorName);
            if(!userObj) {
                userObj = { name: authorName, friendStatus: "none" };
                appData.usersDirectory.push(userObj);
            }
            let isFriend = appData.currentUser.friends.includes(authorName);
            let reqSent = appData.currentUser.friendRequestsSent.includes(authorName);

            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <div style="text-align:center;">
                    <div style="width:70px; height:70px; background:#3498db; border-radius:50%; margin:0 auto 10px auto; display:flex; align-items:center; justify-content:center; font-size:35px;">📖</div>
                    <h3>${authorName}</h3><br>
                    <div style="display:flex; justify-content:center; gap:10px;">
                        <button class="icon-btn" onclick="toggleFriendAction('${authorName}')" id="friendActionBtn">
                            ${isFriend ? 'إزالة صديق' : (reqSent ? 'تم الإرسال' : 'إضافة صديق')}
                        </button>
                    </div><br>
                    <button class="btn-danger" style="width:100%;" onclick="closeModal()">إغلاق</button>
                </div>
            `;
        }

        function toggleFriendAction(name) {
            let isFriend = appData.currentUser.friends.includes(name);
            let reqSent = appData.currentUser.friendRequestsSent.includes(name);
            let btn = document.getElementById('friendActionBtn');

            if(isFriend) {
                appData.currentUser.friends = appData.currentUser.friends.filter(f => f !== name);
                alert("تم إزالة الصديق بنجاح.");
                closeModal();
            } else if(reqSent) {
                appData.currentUser.friendRequestsSent = appData.currentUser.friendRequestsSent.filter(f => f !== name);
                btn.innerText = "إضافة صديق";
                alert("تم إلغاء طلب الصداقة، ويمكنك إرساله من جديد.");
            } else {
                appData.currentUser.friendRequestsSent.push(name);
                btn.innerText = "تم الإرسال";
                alert("تم إرسال طلب الصداقة بنجاح.");
            }
        }

        function openFriendsListModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';
            body.innerHTML = `
                <h3>قائمة الأصدقاء</h3><br>
                <div style="max-height:200px; overflow-y:auto; margin-bottom:15px;">
                    ${appData.currentUser.friends.length === 0 ? '<p>لا يوجد أصدقاء حالياً.</p>' : appData.currentUser.friends.map(f => `<div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid var(--border-color);"><span>${f}</span> <button class="btn-danger" style="padding:2px 8px; font-size:12px;" onclick="removeFriendFromList('${f}')">إزالة</button></div>`).join('')}
                </div>
                <button class="btn-submit" style="width:100%;" onclick="closeModal()">إغلاق</button>
            `;
        }

        function removeFriendFromList(name) {
            appData.currentUser.friends = appData.currentUser.friends.filter(f => f !== name);
            alert("تم إزالة الصديق.");
            closeModal();
        }

        function addToFav(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!appData.currentUser.favorites.includes(story)) {
                appData.currentUser.favorites.push(story);
                alert("تمت الإضافة للمفضلة بنجاح!");
            }
        }

        function markAsUncompleted(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!appData.currentUser.uncompleted.includes(story)) {
                appData.currentUser.uncompleted.push(story);
                alert("تمت الإضافة لقائمة لم يتم تكملتها!");
            }
        }

        function openNotifications() { alert("لا توجد إشعارات جديدة حالياً."); }
        function closeModal() { document.getElementById('globalModal').style.display = 'none'; }
    </script>
</body>
</html>
