<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانجاهاتك - Mangahatak</title>
    
    <!-- أيقونة الموقع بجانب التبويبة (Favicon) -->
    <link rel="icon" href="mangahatak.jfif" type="image/jfif">
    <link rel="shortcut icon" href="mangahatak.jfif" type="image/jfif">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #2c3e50;
            display: flex;
            min-height: 100vh;
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #95a5a6; }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background-color: #1a252f;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100vh;
            right: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-brand img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .sidebar-brand h2 {
            font-size: 1.3rem;
            color: #3498db;
        }

        .user-card {
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .user-card input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border-radius: 5px;
            border: 1px solid #34495e;
            background: #1a252f;
            color: white;
            text-align: center;
        }

        .user-card button {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .user-card button:hover {
            background: #2980b9;
        }

        /* المحتوى الرئيسي */
        .main-content {
            margin-right: 260px;
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .manga-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .manga-card:hover {
            transform: translateY(-5px);
        }

        .manga-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .manga-info {
            padding: 15px;
        }

        .manga-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .manga-info p {
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .error-text { color: #e74c3c; }
        .success-text { color: #2ecc71; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="mangahatak.jfif" alt="Logo">
            <h2>مانجاهاتك</h2>
        </div>

        <!-- قسم إدخال وتثبيت اسم المستخدم -->
        <div class="user-card">
            <p style="font-size: 0.9rem; color: #bdc3c7;">اسمك على المنصة:</p>
            <input type="text" id="usernameInput" placeholder="ادخل اسم المستخدم...">
            <button onclick="saveUsername()">حفظ الاسم</button>
            <div id="usernameStatus" class="status-msg"></div>
        </div>
    </div>

    <!-- المنطقة الرئيسية -->
    <div class="main-content">
        <div class="header">
            <h1>مرحباً بك في منصة مانجاهاتك 📖</h1>
            <p id="welcomeUserText">أهلاً بك زائرنا العزيز!</p>
        </div>

        <h2>أحدث المانجا والقصص</h2>
        <br>
        
        <div class="manga-grid">
            <div class="manga-card">
                <img src="mangahatak.jfif" alt="Manga Cover">
                <div class="manga-info">
                    <h3>قصة مانجاهاتك الخاصة</h3>
                    <p>بواسطة: الأدمن</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // قائمة بأسماء المستخدمين المأخوذة سابقاً
        let registeredUsers = JSON.parse(localStorage.getItem('mangahatak_registered_users')) || ['أدمن', 'أحمد', 'سارة', 'علي'];

        // تحميل الاسم المحفوظ عند فتح الصفحة
        window.onload = function() {
            let currentSavedUser = localStorage.getItem('mangahatak_current_user');
            if (currentSavedUser) {
                document.getElementById('usernameInput').value = currentSavedUser;
                document.getElementById('welcomeUserText').innerText = 'أهلاً بك يا ' + currentSavedUser + ' 👋';
            }
        };

        // دالة حفظ وفحص اسم المستخدم
        function saveUsername() {
            let nameInput = document.getElementById('usernameInput').value.trim();
            let statusDiv = document.getElementById('usernameStatus');
            let currentUser = localStorage.getItem('mangahatak_current_user');

            if (!nameInput) {
                showStatus('يرجى كتابة اسم أولاً!', 'error-text');
                return;
            }

            // فحص هل الاسم مستخدم من قبل شخص آخر؟
            if (registeredUsers.includes(nameInput) && nameInput !== currentUser) {
                showStatus('❌ الاسم مستخدم بالفعل!', 'error-text');
                alert('⚠️ اسم المستخدم هذا مأخوذ بالفعل من قبل شخص آخر! يرجى اختيار اسم جديد.');
                return;
            }

            // إذا كان اسم جديد، يتم تسجيله
            if (!registeredUsers.includes(nameInput)) {
                registeredUsers.push(nameInput);
                localStorage.setItem('mangahatak_registered_users', JSON.stringify(registeredUsers));
            }

            // حفظ المستخدم الحالي
            localStorage.setItem('mangahatak_current_user', nameInput);
            document.getElementById('welcomeUserText').innerText = 'أهلاً بك يا ' + nameInput + ' 👋';
            showStatus('✅ تم حفظ الاسم بنجاح!', 'success-text');
        }

        function showStatus(text, className) {
            let statusDiv = document.getElementById('usernameStatus');
            statusDiv.innerText = text;
            statusDiv.className = 'status-msg ' + className;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
