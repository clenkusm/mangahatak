        body { background-color: #f0f4f8; color: #333; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1e3a8a; color: white; display: flex; flex-direction: column; padding: 20px; position: fixed; right: 0; top: 0; height: 100%; z-index: 100; box-shadow: -2px 0 5px rgba(0,0,0,0.1); }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-area img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ffffff; }
        .logo-area span { font-size: 1.3rem; font-weight: bold; letter-spacing: 0.5px; }
        .nav-links { display: flex; flex-direction: column; gap: 10px; }
        .nav-links a { color: #93c5fd; text-decoration: none; padding: 12px; border-radius: 8px; transition: 0.3s; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
        .nav-links a:hover, .nav-links a.active { background: #1e40af; color: white; }
        .main-content { margin-right: 260px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: white; padding: 15px 30px; display: flex; justify-content: flex-end; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
        .icon-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #334155; transition: 0.2s; }
        .icon-btn:hover { background: #e2e8f0; }
        .page-body { padding: 30px; }
        .hero { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 40px; border-radius: 12px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.15); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(30, 58, 138, 0.1); border-color: #3b82f6; }
        .form-container { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 6px 15px rgba(30, 58, 138, 0.08); max-width: 650px; margin: auto; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background-color: #1e3a8a; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .btn-submit:hover { background-color: #1e40af; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-danger:hover { background: #dc2626; }
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-primary:hover { background: #2563eb; }
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .story-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; text-align: center; border: 1px solid #e2e8f0; }
        .story-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .chat-container { display: flex; height: calc(100vh - 140px); background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .chat-sidebar { width: 300px; border-left: 1px solid #e2e8f0; overflow-y: auto; background: #f8fafc; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #f1f5f9; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; background: white; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 60%; }
        .msg.sent { background: #dbeafe; align-self: flex-end; }
        .msg.received { background: white; align-self: flex-start; border: 1px solid #e2e8f0; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area">
            <img src="mangahatak.jfif" alt="Mangahatak Logo">
            <span>Mangahatak</span>
        </div>
        <nav class="nav-links">
            <a class="active" onclick="switchPage('home', this)"><span>🏠</span> الصفحة الرئيسية</a>
            <a onclick="switchPage('search', this)"><span>🔍</span> البحث</a>
            <a onclick="switchPage('topRated', this)"><span>⭐</span> الأعلى تقييماً</a>
            <a onclick="switchPage('chat', this)"><span>💬</span> المحادثات</a>
            <a onclick="switchPage('addStory', this)"><span>➕</span> إضافة قصة</a>
            <a onclick="switchPage('account', this)"><span>👤</span> الحساب</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <button class="icon-btn" onclick="alert('لا توجد إشعارات جديدة.')">🔔 الإشعارات</button>
            <button class="icon-btn" onclick="alert('قائمة الأصدقاء فارغة.')">👥 الأصدقاء</button>
        </header>
        <div class="page-body" id="mainView"></div>
    </div>

    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let appData = {
            currentUser: { name: "مستخدم ضيف", type: "guest", image: "mangahatak.jfif", stories: [], favorites: [], read: [] },
            stories: [],
            chats: [{ name: "المجموعة العامة", messages: [] }]
        };

        window.onload = () => switchPage('home');

        function switchPage(pageName, element) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');
            const view = document.getElementById('mainView');
            if(pageName === 'home') renderHome();
            else if(pageName === 'search') renderSearch();
            else if(pageName === 'topRated') renderTopRated();
            else if(pageName === 'chat') renderChat();
            else if(pageName === 'addStory') renderAddStory();
            else if(pageName === 'account') renderAccount();
        }

        function renderHome() {
            document.getElementById('mainView').innerHTML = `
                <div class="hero">
                    <h1>أهلاً بك في منصة Mangahatak</h1>
                    <p>وجهتك الأولى لقراءة ومتابعة أحدث مانجا وأنمي.</p>
                </div>
                <h3 style="margin-bottom: 15px; color: #1e3a8a;">القصص المتاحة</h3>
                <div class="stories-grid" id="homeStoriesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'homeStoriesGrid');
        }

        function renderAddStory() {
            document.getElementById('mainView').innerHTML = `
                <div class="form-container">
                    <h2 style="color: #1e3a8a; margin-bottom: 20px;">إضافة قصة جديدة</h2>
                    <div class="form-group"><label>اسم القصة</label><input type="text" id="stName"></div>
                    <div class="form-group"><label>نص القصة</label><textarea rows="4" id="stText"></textarea></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat"><option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option></select>
                    </div>
                    <button class="btn-submit" onclick="submitStory()">نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const cat = document.getElementById('stCat').value;
            if(!name || !text) { alert("يرجى ملء جميع الحقول!"); return; }
            const newStory = { id: Date.now(), title: name, author: appData.currentUser.name, category: cat, image: "mangahatak.jfif", text: text, stars: 5.0, likes: 0 };
            appData.stories.push(newStory);
            appData.currentUser.stories.push(newStory);
            alert("تم النشر بنجاح!");
            switchPage('home');
        }

        function renderAccount() {
            document.getElementById('mainView').innerHTML = `
                <div style="background:white; padding:25px; border-radius:12px; display:flex; align-items:center; gap:20px; margin-bottom:20px; border: 1px solid #e2e8f0;">
                    <img src="${appData.currentUser.image}" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
                    <div>
                        <h2 style="color: #1e3a8a;">${appData.currentUser.name}</h2>
                        <button class="btn-primary" onclick="editAccountModal()" style="margin-top:10px;">تعديل الحساب / تسجيل الدخول</button>
                    </div>
                </div>
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">قصصي (مع زر التعديل والحذف)</h3>
                <div class="stories-grid" id="accStories"></div>
            `;
            renderMyStoriesWithActions();
        }

        function renderMyStoriesWithActions() {
            const grid = document.getElementById('accStories');
            if(!grid) return;
            grid.innerHTML = "";
            if(appData.currentUser.stories.length === 0) {
                grid.innerHTML = "<p style='color: #64748b;'>لا توجد قصص خاصة بك حتى الآن.</p>";
                return;
            }
            appData.currentUser.stories.forEach(story => {
                grid.innerHTML += `
                    <div class="story-card">
                        <img src="${story.image}">
                        <h4 style="color: #1e3a8a; margin-bottom: 5px;">${story.title}</h4>
                        <div style="display:flex; justify-content:center; gap:8px; margin-top:10px;">
                            <button class="btn-primary" onclick="editStory(${story.id})">تعديل</button>
                            <button class="btn-danger" onclick="deleteStory(${story.id})">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteStory(id) {
            appData.stories = appData.stories.filter(s => s.id !== id);
            appData.currentUser.stories = appData.currentUser.stories.filter(s => s.id !== id);
            renderMyStoriesWithActions();
            alert("تم حذف القصة بنجاح!");
        }

        function editStory(id) {
            let story = appData.stories.find(s => s.id === id);
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">تعديل القصة</h3>
                <div class="form-group"><label>اسم القصة</label><input type="text" id="editTitle" value="${story.title}"></div>
                <div class="form-group"><label>نص القصة</label><textarea rows="3" id="editText">${story.text}</textarea></div>
                <button class="btn-submit" onclick="saveEditedStory(${story.id})">حفظ التعديلات</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="document.getElementById('globalModal').style.display='none'">إلغاء</button>
            `;
        }

        function saveEditedStory(id) {
            let story = appData.stories.find(s => s.id === id);
            story.title = document.getElementById('editTitle').value;
            story.text = document.getElementById('editText').value;
            document.getElementById('globalModal').style.display = 'none';
            renderMyStoriesWithActions();
            alert("تم تحديث القصة بنجاح!");
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">تعديل اسم الحساب</h3>
                <div class="form-group"><label>الاسم الجديد</label><input type="text" id="newName" value="${appData.currentUser.name}"></div>
                <button class="btn-submit" onclick="saveAccount()">حفظ</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="document.getElementById('globalModal').style.display='none'">إلغاء</button>
            `;
        }

        function saveAccount() {
            let name = document.getElementById('newName').value;
            if(name) appData.currentUser.name = name;
            document.getElementById('globalModal').style.display = 'none';
            renderAccount();
        }

        function renderStoriesList(arr, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            grid.innerHTML = arr.length === 0 ? "<p style='color: #64748b;'>لا توجد قصص.</p>" : "";
            arr.forEach(s => {
                grid.innerHTML += `<div class="story-card"><img src="${s.image}"><h4>${s.title}</h4></div>`;
            });
        }

        function renderSearch() { document.getElementById('mainView').innerHTML = `<h2>بحث</h2><input type="text" placeholder="ابحث..." style="padding:10px; width:100%; margin-top:10px;">`; }
        function renderTopRated() { document.getElementById('mainView').innerHTML = `<h2>الأعلى تقييماً</h2>`; }
        function renderChat() { document.getElementById('mainView').innerHTML = `<h2>المحادثات العامة</h2>`; }
    </script>
</body>

                <div class="form-container">
                    <h2 style="color: #1e3a8a; margin-bottom: 20px;">إضافة قصة جديدة</h2>
                    <div class="form-group"><label>اسم القصة</label><input type="text" id="stName"></div>
                    <div class="form-group"><label>نص القصة</label><textarea rows="4" id="stText"></textarea></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat"><option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option></select>
                    </div>
                    <button class="btn-submit" onclick="submitStory()">نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const cat = document.getElementById('stCat').value;
            if(!name || !text) { alert("يرجى ملء جميع الحقول!"); return; }
            const newStory = { id: Date.now(), title: name, author: appData.currentUser.name, category: cat, image: "mangahatak.jfif", text: text, stars: 5.0, likes: 0 };
            appData.stories.push(newStory);
            appData.currentUser.stories.push(newStory);
            alert("تم النشر بنجاح!");
            switchPage('home');
        }

        function renderAccount() {
            document.getElementById('mainView').innerHTML = `
                <div style="background:white; padding:25px; border-radius:12px; display:flex; align-items:center; gap:20px; margin-bottom:20px; border: 1px solid #e2e8f0;">
                    <img src="${appData.currentUser.image}" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
                    <div>
                        <h2 style="color: #1e3a8a;">${appData.currentUser.name}</h2>
                        <button class="btn-primary" onclick="editAccountModal()" style="margin-top:10px;">تعديل الحساب / تسجيل الدخول</button>
                    </div>
                </div>
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">قصصي (مع زر التعديل والحذف)</h3>
                <div class="stories-grid" id="accStories"></div>
            `;
            renderMyStoriesWithActions();
        }

        function renderMyStoriesWithActions() {
            const grid = document.getElementById('accStories');
            if(!grid) return;
            grid.innerHTML = "";
            if(appData.currentUser.stories.length === 0) {
                grid.innerHTML = "<p style='color: #64748b;'>لا توجد قصص خاصة بك حتى الآن.</p>";
                return;
            }
            appData.currentUser.stories.forEach(story => {
                grid.innerHTML += `
                    <div class="story-card">
                        <img src="${story.image}">
                        <h4 style="color: #1e3a8a; margin-bottom: 5px;">${story.title}</h4>
                        <div style="display:flex; justify-content:center; gap:8px; margin-top:10px;">
                            <button class="btn-primary" onclick="editStory(${story.id})">تعديل</button>
                            <button class="btn-danger" onclick="deleteStory(${story.id})">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteStory(id) {
            appData.stories = appData.stories.filter(s => s.id !== id);
            appData.currentUser.stories = appData.currentUser.stories.filter(s => s.id !== id);
            renderMyStoriesWithActions();
            alert("تم حذف القصة بنجاح!");
        }

        function editStory(id) {
            let story = appData.stories.find(s => s.id === id);
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">تعديل القصة</h3>
                <div class="form-group"><label>اسم القصة</label><input type="text" id="editTitle" value="${story.title}"></div>
                <div class="form-group"><label>نص القصة</label><textarea rows="3" id="editText">${story.text}</textarea></div>
                <button class="btn-submit" onclick="saveEditedStory(${story.id})">حفظ التعديلات</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="document.getElementById('globalModal').style.display='none'">إلغاء</button>
            `;
        }

        function saveEditedStory(id) {
            let story = appData.stories.find(s => s.id === id);
            story.title = document.getElementById('editTitle').value;
            story.text = document.getElementById('editText').value;
            document.getElementById('globalModal').style.display = 'none';
            renderMyStoriesWithActions();
            alert("تم تحديث القصة بنجاح!");
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color: #1e3a8a; margin-bottom: 15px;">تعديل اسم الحساب</h3>
                <div class="form-group"><label>الاسم الجديد</label><input type="text" id="newName" value="${appData.currentUser.name}"></div>
                <button class="btn-submit" onclick="saveAccount()">حفظ</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="document.getElementById('globalModal').style.display='none'">إلغاء</button>
            `;
        }

        function saveAccount() {
            let name = document.getElementById('newName').value;
            if(name) appData.currentUser.name = name;
            document.getElementById('globalModal').style.display = 'none';
            renderAccount();
        }

        function renderStoriesList(arr, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            grid.innerHTML = arr.length === 0 ? "<p style='color: #64748b;'>لا توجد قصص.</p>" : "";
            arr.forEach(s => {
                grid.innerHTML += `<div class="story-card"><img src="${s.image}"><h4>${s.title}</h4></div>`;
            });
        }

        function renderSearch() { document.getElementById('mainView').innerHTML = `<h2>بحث</h2><input type="text" placeholder="ابحث..." style="padding:10px; width:100%; margin-top:10px;">`; }
        function renderTopRated() { document.getElementById('mainView').innerHTML = `<h2>الأعلى تقييماً</h2>`; }
        function renderChat() { document.getElementById('mainView').innerHTML = `<h2>المحادثات العامة</h2>`; }
    </script>
</body>
</html>
