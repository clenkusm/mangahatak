<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانجاهاتك</title>
    <link rel="icon" type="image/jpeg" href="image_656eb8.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1e3a8a; color: white; display: flex; flex-direction: column; padding: 20px; position: fixed; right: 0; top: 0; height: 100%; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .logo-area img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; background: white; }
        .logo-area h2 { font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-links a { color: #93c5fd; text-decoration: none; padding: 12px; border-radius: 8px; transition: 0.3s; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; }
        .nav-links a:hover, .nav-links a.active { background: #1d4ed8; color: white; }
        .main-content { margin-right: 260px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: white; padding: 15px 30px; display: flex; justify-content: flex-end; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
        .icon-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .icon-btn:hover { background: #f1f5f9; }
        .page-body { padding: 30px; }
        .hero { background: linear-gradient(135deg, #2563eb, #1e3a8a); color: white; padding: 40px; border-radius: 15px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #f1f5f9; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 650px; margin: auto; border: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .btn-submit { background: #16a34a; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .btn-submit:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .story-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; text-align: center; cursor: pointer; border: 1px solid #f1f5f9; transition: 0.3s; }
        .story-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .story-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #e2e8f0; }
        .chat-container { display: flex; height: calc(100vh - 140px); background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .chat-sidebar { width: 300px; border-left: 1px solid #e2e8f0; overflow-y: auto; background: #f8fafc; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; background: white; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 60%; font-size: 14px; }
        .msg.sent { background: #dcf8c6; align-self: flex-end; }
        .msg.received { background: white; align-self: flex-start; border: 1px solid #e2e8f0; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <img src="image_656eb8.png" alt="Logo">
            <h2>Mangahatak</h2>
        </div>
        <nav class="nav-links">
            <a class="active" onclick="switchPage('home', this)"><span>🏠</span> الصفحة الرئيسية</a>
            <a onclick="switchPage('search', this)"><span>🔍</span> البحث</a>
            <a onclick="switchPage('topRated', this)"><span>⭐</span> الأعلى تقييماً</a>
            <a onclick="switchPage('chat', this)"><span>💬</span> المحادثات</a>
            <a onclick="switchPage('addStory', this)"><span>➕</span> إضافة قصة</a>
            <a onclick="switchPage('account', this)"><span>👤</span> الحساب</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <button class="icon-btn" onclick="openNotifications()">🔔 الإشعارات <span id="notifCount" style="color:red;">(0)</span></button>
            <button class="icon-btn" onclick="openFriends()">👥 الأصدقاء</button>
        </header>

        <div class="page-body" id="mainView"></div>
    </div>

    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let appData = {
            currentUser: { name: "مستخدم ضيف", type: "guest", image: "image_656eb8.png", friends: [], stories: [], favorites: [], uncompleted: [], following: [], read: [] },
            registeredUsers: [
                { name: "أحمد محمد", type: "google", email: "ahmed@gmail.com" },
                { name: "محمود علي", type: "facebook", email: "mahmoud@fb.com" }
            ],
            stories: [
                { id: 1, title: "رحلة الفانتازيا الكبرى", author: "أحمد محمد", category: "فانتازيا", privacy: "عامة", image: "image_656eb8.png", text: "هذه قصة خيالية ممتعة...", likes: 120, stars: 4.8, reads: 540, comments: 15 },
                { id: 2, title: "أسرار الظلام والأكشن", author: "محمود علي", category: "أكشن", privacy: "عامة", image: "image_656eb8.png", text: "قصة مليئة بالحماس...", likes: 95, stars: 4.2, reads: 320, comments: 8 }
            ],
            chats: [{ name: "المجموعة العامة", type: "group", messages: [{sender: "أحمد", text: "أهلاً بالجميع!"}] }]
        };

        window.onload = function() {
            renderHome();
        };

        function switchPage(pageName, element) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');

            if(pageName === 'home') renderHome();
            else if(pageName === 'search') renderSearch();
            else if(pageName === 'topRated') renderTopRated();
            else if(pageName === 'chat') renderChat();
            else if(pageName === 'addStory') renderAddStory();
            else if(pageName === 'account') renderAccount();
        }

        function renderHome() {
            document.getElementById('mainView').innerHTML = `
                <div class="hero">
                    <h1 style="font-size: 28px; margin-bottom: 10px;">أهلاً بك في منصة Mangahatak</h1>
                    <p style="font-size: 16px; opacity: 0.9;">وجهتك الأولى لقراءة ومتابعة أحدث مانجا وأنمي بجودة عالية ومترجمة بعناية فائقة.</p>
                </div>
                <div class="cards-grid">
                    <div class="card" onclick="switchPage('addStory')"><h3 style="color:#1e3a8a; margin-bottom:8px;">أنشئ كتابك الخاص</h3><p style="font-size:14px; color:#64748b;">شارك إبداعك مع العالم</p></div>
                    <div class="card" onclick="switchPage('search')"><h3 style="color:#1e3a8a; margin-bottom:8px;">ابحث عن أشهر القصص</h3><p style="font-size:14px; color:#64748b;">استكشف ملايين العناوين</p></div>
                    <div class="card" onclick="switchPage('topRated')"><h3 style="color:#1e3a8a; margin-bottom:8px;">استمتع بأمتع القصص</h3><p style="font-size:14px; color:#64748b;">الأعلى تقييماً وقراءةً</p></div>
                </div>
                <h3 style="margin-bottom: 15px; color:#1e3a8a;">اقتراحات التصنيفات</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;">
                    <button class="icon-btn" onclick="filterByCategory('فانتازيا')">فانتازيا</button>
                    <button class="icon-btn" onclick="filterByCategory('أكشن')">أكشن</button>
                    <button class="icon-btn" onclick="filterByCategory('دراما')">دراما</button>
                    <button class="icon-btn" onclick="filterByCategory('رومانسي')">رومانسي</button>
                    <button class="icon-btn" onclick="filterByCategory('تشونين')">تشونين</button>
                </div>
                <h3 style="margin-bottom: 15px; color:#1e3a8a;">قصص مقترحة لك</h3>
                <div class="stories-grid" id="homeStoriesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'homeStoriesGrid');
        }

        function renderAddStory() {
            document.getElementById('mainView').innerHTML = `
                <div class="form-container">
                    <h2 style="color:#1e3a8a; margin-bottom:15px;">إضافة قصة جديدة</h2>
                    <div class="form-group"><label>صورة القصة (إجباري)</label><input type="file" id="stImage"></div>
                    <div class="form-group"><label>اسم القصة (إجباري)</label><input type="text" id="stName" placeholder="أدخل اسم القصة"></div>
                    <div class="form-group"><label>القصة أو ملف (PDF / Word) (إجباري)</label><textarea rows="4" id="stText" placeholder="اكتب القصة هنا..."></textarea></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat"><option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option><option>تشونين</option></select>
                    </div>
                    <div class="form-group"><label>الخصوصية</label>
                        <select id="stPrivacy"><option value="عامة">عامة</option><option value="خاصة">خاصة</option><option value="للاصدقاء فقط">للاصدقاء فقط</option></select>
                    </div>
                    <button class="btn-submit" onclick="submitStory()">نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const cat = document.getElementById('stCat').value;
            const privacy = document.getElementById('stPrivacy').value;

            if(!name || !text) { alert("خطأ: يجب ملء جميع الخانات الأساسية!"); return; }

            const newStory = {
                id: appData.stories.length + 1,
                title: name,
                author: appData.currentUser.name,
                category: cat,
                privacy: privacy,
                image: "image_656eb8.png",
                text: text,
                likes: 0,
                stars: 5.0,
                reads: 1,
                comments: 0
            };

            appData.stories.push(newStory);
            appData.currentUser.stories.push(newStory);
            alert("تم نشر القصة بنجاح!");
            switchPage('home');
        }

        function renderSearch() {
            document.getElementById('mainView').innerHTML = `
                <div class="form-container" style="max-width:100%; margin-bottom:20px;">
                    <input type="text" id="searchInput" placeholder="ابحث عن اسم القصة..." onkeyup="filterStories()" style="padding:12px; font-size:15px;">
                </div>
                <div class="stories-grid" id="searchGrid"></div>
            `;
            renderStoriesList(appData.stories, 'searchGrid');
        }

        function filterStories() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = appData.stories.filter(s => s.title.toLowerCase().includes(query));
            renderStoriesList(filtered, 'searchGrid');
        }

        function filterByCategory(cat) {
            let filtered = appData.stories.filter(s => s.category === cat);
            document.getElementById('mainView').innerHTML = `
                <button class="icon-btn" onclick="switchPage('home')" style="margin-bottom:20px;">⬅ رجوع للرئيسية</button>
                <h3 style="margin-bottom: 15px; color:#1e3a8a;">تصنيف: ${cat}</h3>
                <div class="stories-grid" id="catGrid"></div>
            `;
            renderStoriesList(filtered, 'catGrid');
        }

        function renderTopRated() {
            document.getElementById('mainView').innerHTML = `
                <h2 style="color:#1e3a8a; margin-bottom:15px;">القصص الأعلى تقييماً</h2>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button class="icon-btn" onclick="renderTopRated()">الكل</button>
                    <button class="icon-btn" onclick="sortStories('likes')">حسب الإعجابات</button>
                    <button class="icon-btn" onclick="sortStories('stars')">حسب النجوم</button>
                </div>
                <div class="stories-grid" id="topGrid"></div>
            `;
            renderStoriesList(appData.stories, 'topGrid');
        }

        function sortStories(by) {
            let sorted = [...appData.stories].sort((a,b) => b[by] - a[by]);
            renderStoriesList(sorted, 'topGrid');
        }

        function renderAccount() {
            document.getElementById('mainView').innerHTML = `
                <div style="background:white; padding:25px; border-radius:12px; display:flex; align-items:center; gap:20px; margin-bottom:20px; border:1px solid #f1f5f9;">
                    <img src="${appData.currentUser.image}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #e2e8f0; background:white;">
                    <div>
                        <h2 style="color:#1e3a8a; margin-bottom:5px;">${appData.currentUser.name}</h2>
                        <p style="color:#64748b; font-size:14px;">نوع الحساب: ${appData.currentUser.type}</p>
                        <button class="btn-primary" style="margin-top:12px;" onclick="editAccountModal()">تسجيل الدخول / تعديل الحساب</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button class="icon-btn" onclick="showAccountTab('stories')">قصصي</button>
                    <button class="icon-btn" onclick="showAccountTab('favorites')">قصص مفضلة</button>
                    <button class="icon-btn" onclick="showAccountTab('read')">تم قراءتها</button>
                </div>
                <div id="accountTabContent"></div>
            `;
            showAccountTab('stories');
        }

        function showAccountTab(tab) {
            const container = document.getElementById('accountTabContent');
            if(tab === 'stories') container.innerHTML = `<div class="stories-grid" id="accStories"></div>`, renderStoriesList(appData.currentUser.stories, 'accStories');
            else if(tab === 'favorites') container.innerHTML = `<div class="stories-grid" id="accFav"></div>`, renderStoriesList(appData.currentUser.favorites, 'accFav');
            else if(tab === 'read') container.innerHTML = `<div class="stories-grid" id="accRead"></div>`, renderStoriesList(appData.currentUser.read, 'accRead');
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3 style="color:#1e3a8a; margin-bottom:15px;">تسجيل الدخول</h3>
                <div class="form-group"><label>البريد أو اسم المستخدم</label><input type="text" id="loginInput" placeholder="أدخل اسمك أو بريدك"></div>
                <div class="form-group"><label>اختر الطريقة:</label>
                    <select id="loginType">
                        <option value="guest">ضيف</option>
                        <option value="google">جوجل</option>
                        <option value="facebook">فيسبوك</option>
                    </select>
                </div>
                <button class="btn-submit" onclick="checkAndLogin()" style="margin-bottom:10px;">تسجيل الدخول</button>
                <button class="btn-danger" style="width:100%;" onclick="closeModal()">إلغاء</button>
            `;
        }

        function checkAndLogin() {
            let inputName = document.getElementById('loginInput').value;
            let type = document.getElementById('loginType').value;

            if(type === 'guest') {
                appData.currentUser = { name: "مستخدم ضيف", type: "guest", image: "image_656eb8.png", friends: [], stories: [], favorites: [], uncompleted: [], following: [], read: [] };
                closeModal();
                renderAccount();
                return;
            }

            let foundUser = appData.registeredUsers.find(u => u.name === inputName && u.type === type);
            if(foundUser) {
                appData.currentUser.name = foundUser.name;
                appData.currentUser.type = foundUser.type;
                appData.currentUser.image = "image_656eb8.png";
                alert("تم تسجيل الدخول بنجاح!");
                closeModal();
                renderAccount();
            } else {
                if(confirm("الحساب غير متوفر! هل تريد إنشاء حساب جديد بهذا الاسم؟")) {
                    appData.registeredUsers.push({ name: inputName || "مستخدم جديد", type: type });
                    appData.currentUser.name = inputName || "مستخدم جديد";
                    appData.currentUser.type = type;
                    alert("تم إنشاء الحساب وتسجيل الدخول بنجاح!");
                    closeModal();
                    renderAccount();
                }
            }
        }

        function renderChat() {
            document.getElementById('mainView').innerHTML = `
                <div class="chat-container">
                    <div class="chat-sidebar"><div style="padding:15px; background:#f1f5f9; font-weight:bold; border-bottom:1px solid #e2e8f0;">💬 المجموعة العامة</div></div>
                    <div class="chat-main">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
                            <button class="btn-primary" onclick="sendMessage()">إرسال</button>
                        </div>
                    </div>
                </div>`;
            loadChatMessages();
        }

        function loadChatMessages() {
            let container = document.getElementById('chatMessages');
            container.innerHTML = "";
            appData.chats[0].messages.forEach(m => {
                container.innerHTML += `<div class="msg received"><b>${m.sender}:</b> ${m.text}</div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            let text = document.getElementById('msgInput').value;
            if(!text) return;
            appData.chats[0].messages.push({ sender: appData.currentUser.name, text: text });
            document.getElementById('msgInput').value = "";
            loadChatMessages();
        }

        function renderStoriesList(arr, elementId) {
            const grid = document.getElementById(elementId);
            if(!grid) return;
            grid.innerHTML = arr.length === 0 ? "<p style='color:#64748b;'>لا توجد قصص مضافة حالياً.</p>" : "";
            arr.forEach(s => {
                grid.innerHTML += `
                    <div class="story-card" onclick="openStoryDetail(${s.id})">
                        <img src="${s.image}">
                        <h4 style="color:#1e3a8a; margin-bottom:5px;">${s.title}</h4>
                        <p style="font-size:12px; color:#64748b;">التصنيف: ${s.category}</p>
                        <p style="font-size:12px; color:#f59e0b; margin-top:5px;">⭐ ${s.stars} | 👍 ${s.likes}</p>
                    </div>`;
            });
        }

        function openStoryDetail(id) {
            let story = appData.stories.find(s => s.id === id);
            document.getElementById('mainView').innerHTML = `
                <button class="icon-btn" onclick="switchPage('home')" style="margin-bottom:20px;">⬅ رجوع</button>
                <div style="background:white; padding:30px; border-radius:12px; border:1px solid #f1f5f9;">
                    <h2 style="color:#1e3a8a; margin-bottom:15px;">${story.title}</h2>
                    <p style="line-height: 1.8; color:#334155;">${story.text}</p>
                </div>`;
        }

        function openNotifications() { alert("لا توجد إشعارات جديدة حالياً."); }
        function openFriends() { alert("قائمة الأصدقاء فارغة."); }
        function closeModal() { document.getElementById('globalModal').style.display = 'none'; }
    </script>
</body>
</html>
