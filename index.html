<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانجاهاتك</title>
    <link rel="icon" type="image/jpeg" href="image_656eb8.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #2c3e50; color: white; display: flex; flex-direction: column; padding: 20px; position: fixed; right: 0; top: 0; height: 100%; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .logo-area img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; background: white; }
        .logo-area h2 { font-size: 18px; font-weight: bold; }
        .nav-links { display: flex; flex-direction: column; gap: 10px; }
        .nav-links a { color: #bdc3c7; text-decoration: none; padding: 12px; border-radius: 8px; transition: 0.3s; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { background: #34495e; color: white; }
        .main-content { margin-right: 260px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: white; padding: 15px 30px; display: flex; justify-content: flex-end; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; }
        .icon-btn { background: #ecf0f1; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .page-body { padding: 30px; }
        .hero { background: linear-gradient(135deg, #3498db, #2c3e50); color: white; padding: 40px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 650px; margin: auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .story-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; text-align: center; cursor: pointer; }
        .story-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .chat-container { display: flex; height: calc(100vh - 140px); background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-sidebar { width: 300px; border-left: 1px solid #eee; overflow-y: auto; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 60%; }
        .msg.sent { background: #dcf8c6; align-self: flex-end; }
        .msg.received { background: white; align-self: flex-start; border: 1px solid #eee; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 400px; max-width: 90%; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <img src="image_656eb8.png" alt="Logo">
            <h2>مانجاهاتك</h2>
        </div>
        <nav class="nav-links">
            <a class="active" onclick="switchPage('home', this)"><span>🏠</span> الصفحة الرئيسية</a>
            <a onclick="switchPage('search', this)"><span>🔍</span> البحث</a>
            <a onclick="switchPage('topRated', this)"><span>⭐</span> الأعلى تقييما</a>
            <a onclick="switchPage('chat', this)"><span>💬</span> المحادثات</a>
            <a onclick="switchPage('addStory', this)"><span>➕</span> اضافة قصة</a>
            <a onclick="switchPage('account', this)"><span>👤</span> الحساب</a>
        </nav>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <button class="icon-btn" onclick="openNotifications()">🔔 الإشعارات <span id="notifCount" style="color:red;">(0)</span></button>
            <button class="icon-btn" onclick="openFriends()">👥 الأصدقاء</button>
        </header>

        <div class="page-body" id="mainView"></div>
    </div>

    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let appData = {
            currentUser: { name: "مستخدم ضيف", type: "guest", image: "image_656eb8.png", friends: [], stories: [], favorites: [], uncompleted: [], following: [], read: [] },
            registeredUsers: [
                { name: "أحمد محمد", type: "google", email: "ahmed@gmail.com" },
                { name: "محمود علي", type: "facebook", email: "mahmoud@fb.com" }
            ],
            stories: [
                { id: 1, title: "رحلة الفانتازيا الكبرى", author: "أحمد محمد", category: "فانتازيا", privacy: "عامة", image: "image_656eb8.png", text: "هذه قصة خيالية ممتعة...", likes: 120, stars: 4.8, reads: 540, comments: 15 },
                { id: 2, title: "أسرار الظلام والأكشن", author: "محمود علي", category: "أكشن", privacy: "عامة", image: "image_656eb8.png", text: "قصة مليئة بالحماس...", likes: 95, stars: 4.2, reads: 320, comments: 8 }
            ],
            lists: [],
            notifications: [],
            chats: [{ name: "المجموعة العامة", type: "group", messages: [{sender: "أحمد", text: "أهلاً بالجميع!"}] }]
        };

        window.onload = function() {
            renderHome();
        };

        function switchPage(pageName, element) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');

            if(pageName === 'home') renderHome();
            else if(pageName === 'search') renderSearch();
            else if(pageName === 'topRated') renderTopRated();
            else if(pageName === 'chat') renderChat();
            else if(pageName === 'addStory') renderAddStory();
            else if(pageName === 'account') renderAccount();
        }

        function renderHome() {
            document.getElementById('mainView').innerHTML = `
                <div class="hero">
                    <h1>أهلاً بك في مانجاهاتك</h1>
                    <p>منصتك الأولى لرفع وقراءة أمتع القصص والروايات</p>
                </div>
                <div class="cards-grid">
                    <div class="card" onclick="switchPage('addStory')"><h3>أنشئ كتابك الخاص</h3><p>شارك إبداعك مع العالم</p></div>
                    <div class="card" onclick="switchPage('search')"><h3>ابحث عن أشهر القصص</h3><p>استكشف ملايين العناوين</p></div>
                    <div class="card" onclick="switchPage('topRated')"><h3>استمتع بأمتع القصص</h3><p>الأعلى تقييماً وقراءةً</p></div>
                </div>
                <h3 style="margin-bottom: 15px;">اقتراحات التصنيفات</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;">
                    <button class="icon-btn" onclick="filterByCategory('فانتازيا')">فانتازيا</button>
                    <button class="icon-btn" onclick="filterByCategory('أكشن')">أكشن</button>
                    <button class="icon-btn" onclick="filterByCategory('دراما')">دراما</button>
                    <button class="icon-btn" onclick="filterByCategory('رومانسي')">رومانسي</button>
                    <button class="icon-btn" onclick="filterByCategory('تشونين')">تشونين</button>
                </div>
                <h3 style="margin-bottom: 15px;">قصص مقترحة لك</h3>
                <div class="stories-grid" id="homeStoriesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'homeStoriesGrid');
        }

        function renderAddStory() {
            document.getElementById('mainView').innerHTML = `
                <div class="form-container">
                    <h2>اضافة قصة جديدة</h2><br>
                    <div class="form-group"><label>صورة القصة (إجباري)</label><input type="file" id="stImage"></div>
                    <div class="form-group"><label>اسم القصة (إجباري)</label><input type="text" id="stName"></div>
                    <div class="form-group"><label>القصة أو ملف (PDF / Word) (إجباري)</label><textarea rows="4" id="stText" placeholder="اكتب القصة هنا..."></textarea></div>
                    <div class="form-group"><label>التصنيف</label>
                        <select id="stCat"><option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option><option>تشونين</option></select>
                    </div>
                    <div class="form-group"><label>الخصوصية</label>
                        <select id="stPrivacy"><option value="عامة">عامة</option><option value="خاصة">خاصة</option><option value="للاصدقاء فقط">للاصدقاء فقط</option></select>
                    </div>
                    <button class="btn-submit" onclick="submitStory()">نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const cat = document.getElementById('stCat').value;
            const privacy = document.getElementById('stPrivacy').value;

            if(!name || !text) { alert("خطأ: يجب ملء جميع الخانات الأساسية!"); return; }

            const newStory = {
                id: appData.stories.length + 1,
                title: name,
                author: appData.currentUser.name,
                category: cat,
                privacy: privacy,
                image: "image_656eb8.png",
                text: text,
                likes: 0,
                stars: 5.0,
                reads: 1,
                comments: 0
            };

            appData.stories.push(newStory);
            appData.currentUser.stories.push(newStory);
            alert("تم نشر القصة بنجاح!");
            switchPage('home');
        }

        function renderSearch() {
            document.getElementById('mainView').innerHTML = `
                <div class="form-container" style="max-width:100%; margin-bottom:20px;">
                    <input type="text" id="searchInput" placeholder="ابحث عن اسم القصة..." onkeyup="filterStories()" style="padding:15px; font-size:16px;">
                </div>
                <div class="stories-grid" id="searchGrid"></div>
            `;
            renderStoriesList(appData.stories, 'searchGrid');
        }

        function filterStories() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = appData.stories.filter(s => s.title.toLowerCase().includes(query));
            renderStoriesList(filtered, 'searchGrid');
        }

        function renderTopRated() {
            document.getElementById('mainView').innerHTML = `
                <h2>القصص الأعلى تقييماً</h2><br>
                <div class="stories-grid" id="topGrid"></div>
            `;
            renderStoriesList(appData.stories, 'topGrid');
        }

        function renderAccount() {
            document.getElementById('mainView').innerHTML = `
                <div style="background:white; padding:20px; border-radius:10px; display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                    <img src="${appData.currentUser.image}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; background:white;">
                    <div>
                        <h2>${appData.currentUser.name}</h2>
                        <p>نوع الحساب: ${appData.currentUser.type}</p>
                        <button class="btn-primary" style="margin-top:10px;" onclick="editAccountModal()">تسجيل الدخول / تعديل الحساب</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button class="icon-btn" onclick="showAccountTab('stories')">قصصي</button>
                    <button class="icon-btn" onclick="showAccountTab('favorites')">قصص مفضلة</button>
                    <button class="icon-btn" onclick="showAccountTab('read')">تم قراءتها</button>
                </div>
                <div id="accountTabContent"></div>
            `;
            showAccountTab('stories');
        }

        function showAccountTab(tab) {
            const container = document.getElementById('accountTabContent');
            if(tab === 'stories') container.innerHTML = `<div class="stories-grid" id="accStories"></div>`, renderStoriesList(appData.currentUser.stories, 'accStories');
            else if(tab === 'favorites') container.innerHTML = `<div class="stories-grid" id="accFav"></div>`, renderStoriesList(appData.currentUser.favorites, 'accFav');
            else if(tab === 'read') container.innerHTML = `<div class="stories-grid" id="accRead"></div>`, renderStoriesList(appData.currentUser.read, 'accRead');
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            modal.style.display = 'flex';
            document.getElementById('modalBody').innerHTML = `
                <h3>تسجيل الدخول</h3><br>
                <div class="form-group"><label>البريد أو اسم المستخدم</label><input type="text" id="loginInput" placeholder="أدخل اسمك أو بريدك"></div>
                <div class="form-group"><label>اختر الطريقة:</label>
                    <select id="loginType">
                        <option value="guest">ضيف</option>
                        <option value="google">جوجل</option>
                        <option value="facebook">فيسبوك</option>
                    </select>
                </div>
                <button class="btn-submit" onclick="checkAndLogin()">تسجيل الدخول</button>
                <button class="btn-danger" style="margin-top:10px; width:100%;" onclick="closeModal()">إلغاء</button>
            `;
        }

        function checkAndLogin() {
            let inputName = document.getElementById('loginInput').value;
            let type = document.getElementById('loginType').value;

            if(type === 'guest') {
                appData.currentUser = { name: "مستخدم ضيف", type: "guest", image: "image_656eb8.png", friends: [], stories: [], favorites: [], uncompleted: [], following: [], read: [] };
                closeModal();
                renderAccount();
                return;
            }

            let foundUser = appData.registeredUsers.find(u => u.name === inputName && u.type === type);
            if(foundUser) {
                appData.currentUser.name = foundUser.name;
                appData.currentUser.type = foundUser.type;
                appData.currentUser.image = "image_656eb8.png";
                alert("تم تسجيل الدخول بنجاح!");
                closeModal();
                renderAccount();
            } else {
                if(confirm("الحساب غير متوفر! هل لديك حساب أم تريد إنشاء حساب جديد؟")) {
                    let newName = prompt("أدخل اسم الحساب الجديد للإنشاء:");
                    if(newName) {
                        appData.registeredUsers.push({ name: newName, type: type });
                        appData.currentUser.name = newName;
                        appData.currentUser.type = type;
                        alert("تم إنشاء الحساب وتسجيل الدخول بنجاح!");
                        closeModal();
                        renderAccount();
                    }
                }
            }
        }

        function renderChat() {
            document.getElementById('mainView').innerHTML = `
                <div class="chat-container">
                    <div class="chat-sidebar"><div style="padding:15px; background:#eee;">💬 المجموعة العامة</div></div>
                    <div class="chat-main">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-area"><input type="text" id="msgInput" placeholder="اكتب رسالة..."><button class="btn-primary" onclick="sendMessage()">إرسال</button></div>
                    </div>
                </div>`;
            loadChatMessages();
        }

        function loadChatMessages() {
            let container = document.getElementById('chatMessages');
            container.innerHTML = "";
            appData.chats[0].messages.forEach(m => {
                container.innerHTML += `<div class="msg received"><b>${m.sender}:</b> ${m.text}</div>`;
            });
        }

        function sendMessage() {
            let text = document.getElementById('msgInput').value;
            if(!text) return;
            appData.chats[0].messages.push({ sender: appData.currentUser.name, text: text });
            document.getElementById('msgInput').value = "";
            loadChatMessages();
        }

        function renderStoriesList(arr, elementId) {
            const grid = document.getElementById(elementId);
            if(!grid) return;
            grid.innerHTML = arr.length === 0 ? "<p>لا توجد قصص.</p>" : "";
            arr.forEach(s => {
                grid.innerHTML += `
                    <div class="story-card" onclick="openStoryDetail(${s.id})">
                        <img src="${s.image}">
                        <h4>${s.title}</h4>
                        <p style="font-size:12px; color:#777;">${s.category}</p>
                    </div>`;
            });
        }

        function openStoryDetail(id) {
            let story = appData.stories.find(s => s.id === id);
            document.getElementById('mainView').innerHTML = `
                <button class="icon-btn" onclick="switchPage('home')">⬅ رجوع</button><br><br>
                <div style="background:white; padding:30px; border-radius:10px;">
                    <h2>${story.title}</h2>
                    <p>${story.text}</p>
                </div>`;
        }

        function openNotifications() { alert("لا توجد إشعارات جديدة."); }
        function openFriends() { alert("قائمة الأصدقاء فارغة."); }
        function closeModal() { document.getElementById('globalModal').style.display = 'none'; }
    </script>
</body>
</html>
