<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانجاهاتك</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #bdc3c7;
            --sidebar-hover: #34495e;
            --card-bg: white;
            --topbar-bg: white;
            --border-color: #ddd;
            --input-bg: white;
            --modal-bg: white;
            --msg-received: white;
            --msg-sent: #dcf8c6;
            --msg-sent-text: #333;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #a0a0a0;
            --sidebar-hover: #2c2c2c;
            --card-bg: #1e1e1e;
            --topbar-bg: #1e1e1e;
            --border-color: #333;
            --input-bg: #2d2d2d;
            --modal-bg: #1e1e1e;
            --msg-received: #2d2d2d;
            --msg-sent: #005c4b;
            --msg-sent-text: #fff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; padding: 20px; position: fixed; right: 0; top: 0; height: 100%; z-index: 100; border-left: 1px solid var(--border-color); }
        .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
        .nav-links a { color: var(--sidebar-text); text-decoration: none; padding: 12px; border-radius: 8px; transition: 0.3s; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { background: var(--sidebar-hover); color: white; }
        
        .theme-toggle-area { padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
        .theme-btn { background: var(--sidebar-hover); color: var(--sidebar-text); border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; }
        
        .main-content { margin-right: 260px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { background: var(--topbar-bg); padding: 15px 30px; display: flex; justify-content: flex-end; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 90; border-bottom: 1px solid var(--border-color); align-items: center; }
        
        .icon-btn { background: var(--sidebar-hover); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .icon-btn.active-action { background: #3498db; color: white; border-color: #2980b9; }
        .icon-btn:hover { opacity: 0.8; }
        
        .page-body { padding: 30px; }
        .hero { background: linear-gradient(135deg, #3498db, #2c3e50); color: white; padding: 40px; border-radius: 15px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid var(--border-color); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .form-container { background: var(--card-bg); color: var(--text-color); padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 650px; margin: auto; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--input-bg); color: var(--text-color); }
        
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .btn-warning { background: #f39c12; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .story-card { background: var(--card-bg); color: var(--text-color); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; text-align: center; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 220px; position: relative; }
        .story-img-icon { width: 80px; height: 110px; border-radius: 6px; object-fit: cover; margin-bottom: 10px; cursor: pointer; border: 2px solid var(--border-color); }
        .story-title-click { cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .story-title-click:hover { color: #3498db; text-decoration: underline; }
        
        .chat-container { display: flex; height: calc(100vh - 140px); background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .chat-sidebar { width: 300px; border-left: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-color); display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--topbar-bg); }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--input-bg); color: var(--text-color); }
        
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 60%; position: relative; word-break: break-word; }
        .msg.sent { background: var(--msg-sent); color: var(--msg-sent-text); align-self: flex-end; }
        .msg.received { background: var(--msg-received); color: var(--text-color); align-self: flex-start; border: 1px solid var(--border-color); }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: var(--modal-bg); color: var(--text-color); padding: 30px; border-radius: 10px; width: 450px; max-width: 90%; border: 1px solid var(--border-color); box-shadow: 0 5px 25px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto; }
        
        .user-avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
        
        /* نجوم التقييم التفاعلية */
        .star-rating-container { display: flex; gap: 5px; justify-content: center; font-size: 28px; cursor: pointer; margin: 10px 0; }
        .star { color: #ccc; transition: 0.2s; }
        .star.active { color: #f39c12; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <span>📖</span>
            <h2>مانجاهاتك</h2>
        </div>
        <nav class="nav-links">
            <a class="active" onclick="switchPage('home', this)"><span>🏠</span> الصفحة الرئيسية</a>
            <a onclick="switchPage('search', this)"><span>🔍</span> البحث</a>
            <a onclick="switchPage('topRated', this)"><span>⭐</span> الأعلى تقييما</a>
            <a onclick="switchPage('chat', this)"><span>💬</span> المحادثات</a>
            <a onclick="switchPage('addStory', this)"><span>➕</span> اضافة قصة</a>
            <a onclick="switchPage('account', this)"><span>👤</span> الحساب</a>
        </nav>
        <div class="theme-toggle-area">
            <button class="theme-btn" id="themeToggleBtn" onclick="toggleDarkMode()">
                <span>🌙</span> الوضع المظلم
            </button>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <button class="icon-btn" onclick="openNotificationsModal()">🔔 الإشعارات <span id="notifCount" style="color:red;">(0)</span></button>
            <button class="icon-btn" onclick="openFriendsModal()">👥 الأصدقاء</button>
        </header>

        <div class="page-body" id="mainView">
        </div>
    </div>

    <div class="modal" id="globalModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let appData = {
            currentUser: { 
                name: "مستخدم ضيف", 
                image: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100", 
                friends: [], 
                stories: [], 
                favorites: [], 
                uncompleted: [], 
                following: [], 
                read: [], 
                friendRequests: {},
                customLists: []
            },
            stories: [],
            lists: [],
            notifications: [],
            chats: [{ name: "المجموعة العامة", type: "group", messages: [], members: ["مستخدم ضيف"] }],
            usersList: [
                { name: "أحمد محمد", image: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100", status: "متاح" },
                { name: "محمود علي", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100", status: "مشغول" },
                { name: "سارة خالد", image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100", status: "تكتب رواية" }
            ],
            isDarkMode: false
        };

        function saveToLocalStorage() {
            localStorage.setItem('mangahat_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            let saved = localStorage.getItem('mangahat_data');
            if(saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {
                    console.error("Error loading saved data", e);
                }
            }
        }

        window.onload = function() {
            loadFromLocalStorage();
            if(appData.isDarkMode) {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('themeToggleBtn');
                if(btn) btn.innerHTML = '<span>☀️</span> الوضع الفاتح';
            }
            renderHome();
        };

        function updateNotifBadge() {
            let unread = appData.notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifCount');
            if(badge) badge.innerText = `(${unread})`;
        }

        function openNotificationsModal() {
            appData.notifications.forEach(n => n.read = true);
            updateNotifBadge();
            saveToLocalStorage();
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            let listHTML = "";
            appData.notifications.forEach(n => {
                listHTML += `<li style="padding:10px; border-bottom:1px solid var(--border-color); margin-bottom:5px;">📢 ${n.text}</li>`;
            });
            if(!listHTML) listHTML = "<p>لا توجد إشعارات حالياً.</p>";

            body.innerHTML = `
                <h3>🔔 الإشعارات</h3><br>
                <ul style="list-style:none; padding:0; max-height:250px; overflow-y:auto;">${listHTML}</ul>
                <button class="icon-btn" style="margin-top:15px; width:100%; justify-content:center;" onclick="closeModal()">❌ إغلاق</button>
            `;
        }

        function closeModal() {
            document.getElementById('globalModal').style.display = 'none';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            appData.isDarkMode = isDark;
            const btn = document.getElementById('themeToggleBtn');
            btn.innerHTML = isDark ? '<span>☀️</span> الوضع الفاتح' : '<span>🌙</span> الوضع المظلم';
            saveToLocalStorage();
        }

        function switchPage(pageName, element) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(element) element.classList.add('active');

            if(pageName === 'home') renderHome();
            else if(pageName === 'search') renderSearch();
            else if(pageName === 'topRated') renderTopRated();
            else if(pageName === 'chat') renderChat();
            else if(pageName === 'addStory') renderAddStory();
            else if(pageName === 'account') renderAccount();
        }

        function handleImageUpload(fileInputId, callback) {
            const fileInput = document.getElementById(fileInputId);
            if(fileInput && fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { callback(e.target.result); }
                reader.readAsDataURL(fileInput.files[0]);
            } else { callback(null); }
        }

        function renderHome() {
            updateNotifBadge();
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="hero">
                    <h1>📖 أهلاً بك في مانجاهاتك</h1>
                    <p>منصتك الأولى لرفع وقراءة أمتع القصص والروايات</p>
                </div>
                <div class="cards-grid">
                    <div class="card" onclick="switchPage('addStory')"><h3>✍️ أنشئ كتابك الخاص</h3><p>شارك إبداعك مع العالم</p></div>
                    <div class="card" onclick="switchPage('search')"><h3>🔍 ابحث عن أشهر القصص</h3><p>استكشف ملايين العناوين</p></div>
                    <div class="card" onclick="switchPage('topRated')"><h3>⭐ استمتع بأمتع القصص</h3><p>الأعلى تقييماً وقراءةً</p></div>
                </div>
                <h3 style="margin-bottom: 15px;">🏷️ اقتراحات التصنيفات</h3>
                <div style="display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;">
                    <button class="icon-btn" onclick="filterByCategory('فانتازيا')">🌟 فانتازيا</button>
                    <button class="icon-btn" onclick="filterByCategory('أكشن')">🔥 أكشن</button>
                    <button class="icon-btn" onclick="filterByCategory('دراما')">🎭 دراما</button>
                    <button class="icon-btn" onclick="filterByCategory('رومانسي')">💖 رومانسي</button>
                    <button class="icon-btn" onclick="filterByCategory('تشونين')">⚡ تشونين</button>
                </div>
                <h3 style="margin-bottom: 15px;">📚 قصص مقترحة لك</h3>
                <div class="stories-grid" id="homeStoriesGrid"></div>
            `;
            renderStoriesList(appData.stories, 'homeStoriesGrid');
        }

        function filterByCategory(cat) {
            switchPage('search');
            setTimeout(() => filterByCatSearch(cat), 50);
        }

        function renderAddStory() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="form-container">
                    <h2>✍️ اضافة قصة جديدة</h2><br>
                    <div class="form-group"><label>📌 اسم القصة (إجباري)</label><input type="text" id="stName"></div>
                    
                    <div class="form-group">
                        <label>🖼️ صورة القصة (اختر من الجهاز أو ضع رابط مباشر)</label>
                        <input type="text" id="stImgUrl" placeholder="https://example.com/image.jpg" style="margin-bottom: 8px;">
                        <input type="file" id="stImgFile" accept="image/*">
                    </div>

                    <div class="form-group"><label>📜 كتابة القصة أو تحميل ملف</label><textarea rows="4" id="stText" placeholder="اكتب القصة هنا..."></textarea></div>
                    <div class="form-group"><label>📁 أو تحميل ملف PDF / Word</label><input type="file" id="stFile" accept=".pdf,.doc,.docx"></div>
                    <div class="form-group"><label>🏷️ التصنيف</label>
                        <select id="stCat">
                            <option>فانتازيا</option><option>أكشن</option><option>دراما</option><option>رومانسي</option><option>تشونين</option><option>غموض</option><option>رعب</option>
                        </select>
                    </div>
                    <div class="form-group"><label>🔒 الخصوصية</label>
                        <select id="stPrivacy">
                            <option value="عامة">عامة</option><option value="خاصة">خاصة</option><option value="للاصدقاء فقط">للاصدقاء فقط</option>
                        </select>
                    </div>
                    <button class="btn-submit" onclick="submitStory()">🚀 نشر القصة</button>
                </div>
            `;
        }

        function submitStory() {
            const name = document.getElementById('stName').value;
            const text = document.getElementById('stText').value;
            const fileInput = document.getElementById('stFile').files[0];
            const cat = document.getElementById('stCat').value;
            const privacy = document.getElementById('stPrivacy').value;
            const urlInput = document.getElementById('stImgUrl').value;

            if(!name) { alert("خطأ: اسم القصة إجباري!"); return; }
            if(!text && !fileInput) { alert("خطأ: يجب كتابة القصة أو تحميل ملف واحد على الأقل!"); return; }

            handleImageUpload('stImgFile', function(base64Image) {
                const finalImage = base64Image || urlInput || "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300";
                let fileContentInfo = text;
                if(fileInput) { fileContentInfo += ` [تم إرفاق ملف: ${fileInput.name}]`; }

                const newStory = {
                    id: Date.now(),
                    title: name,
                    image: finalImage,
                    author: appData.currentUser.name,
                    category: cat,
                    privacy: privacy,
                    text: fileContentInfo,
                    likesCount: 0,
                    dislikesCount: 0,
                    likesBy: [],     /* أسماء أو معرفات من عمل إعجاب */
                    dislikesBy: [],  /* أسماء أو معرفات من عمل ديسلايك */
                    ratings: {},     /* تخزين تقييمات المستخدمين لشكل: { "اسم_المستخدم": 4 } */
                    stars: 5.0,
                    reads: 1,
                    comments: []
                };

                appData.stories.push(newStory);
                appData.currentUser.stories.push(newStory);
                saveToLocalStorage();
                alert("✅ تم نشر القصة بنجاح!");
                switchPage('home');
            });
        }

        function renderSearch() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="form-container" style="max-width:100%; margin-bottom:20px;">
                    <input type="text" id="searchInput" placeholder="🔍 ابحث عن اسم القصة..." onkeyup="filterStories()" style="padding:15px; font-size:16px;">
                    <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="icon-btn" onclick="filterByCatSearch('الكل')">🌐 الكل</button>
                        <button class="icon-btn" onclick="filterByCatSearch('فانتازيا')">🌟 فانتازيا</button>
                        <button class="icon-btn" onclick="filterByCatSearch('أكشن')">🔥 أكشن</button>
                        <button class="icon-btn" onclick="filterByCatSearch('دراما')">🎭 دراما</button>
                        <button class="icon-btn" onclick="filterByCatSearch('رومانسي')">💖 رومانسي</button>
                        <button class="icon-btn" onclick="filterByCatSearch('تشونين')">⚡ تشونين</button>
                    </div>
                </div>
                <div class="stories-grid" id="searchGrid"></div>
            `;
            renderStoriesList(appData.stories, 'searchGrid');
        }

        function filterStories() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = appData.stories.filter(s => s.title.toLowerCase().includes(query));
            renderStoriesList(filtered, 'searchGrid');
        }

        function filterByCatSearch(cat) {
            if(cat === 'الكل') renderStoriesList(appData.stories, 'searchGrid');
            else {
                let filtered = appData.stories.filter(s => s.category === cat);
                renderStoriesList(filtered, 'searchGrid');
            }
        }

        function renderTopRated() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <h2>⭐ القصص الأعلى تقييماً</h2><br>
                <div style="margin-bottom:20px; display:flex; gap:10px;">
                    <button class="icon-btn" onclick="sortTop('likes')">👍 حسب الإعجابات</button>
                    <button class="icon-btn" onclick="sortTop('stars')">⭐ حسب النجوم</button>
                    <button class="icon-btn" onclick="sortTop('both')">🔥 الاثنين معاً</button>
                </div>
                <div class="stories-grid" id="topGrid"></div>
            `;
            sortTop('both');
        }

        function sortTop(type) {
            let sorted = [...appData.stories];
            if(type === 'likes') sorted.sort((a,b) => b.likesCount - a.likesCount);
            else if(type === 'stars') sorted.sort((a,b) => b.stars - a.stars);
            else sorted.sort((a,b) => (b.likesCount * b.stars) - (a.likesCount * a.stars));
            renderStoriesList(sorted, 'topGrid');
        }

        function renderAccount() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div style="background:var(--card-bg); padding:20px; border-radius:10px; display:flex; align-items:center; gap:20px; margin-bottom:20px; border:1px solid var(--border-color);">
                    <img src="${appData.currentUser.image}" class="user-avatar-preview">
                    <div>
                        <h2>👤 ${appData.currentUser.name}</h2>
                        <button class="btn-primary" style="margin-top:10px;" onclick="editAccountModal()">✏️ تعديل الحساب</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
                    <button class="icon-btn" onclick="showAccountTab('stories')">📚 قصصي</button>
                    <button class="icon-btn" onclick="showAccountTab('favorites')">⭐ قصص مفضلة</button>
                </div>
                <div id="accountTabContent"></div>
            `;
            showAccountTab('stories');
        }

        function editAccountModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            body.innerHTML = `
                <h3>✏️ تعديل الحساب الشخصي</h3><br>
                <div class="form-group"><label>اسم المستخدم</label><input type="text" id="editUserName" value="${appData.currentUser.name}"></div>
                <div class="form-group">
                    <label>صورة البروفايل (رابط مباشر أو رفع من الجهاز)</label>
                    <input type="text" id="editUserImgUrl" placeholder="https://..." style="margin-bottom:8px;">
                    <input type="file" id="editUserImgFile" accept="image/*">
                </div>
                <button class="btn-submit" onclick="saveAccountChanges()">💾 حفظ التعديلات</button>
                <button class="btn-danger" style="margin-top:10px; width:100%; justify-content:center;" onclick="closeModal()">❌ إلغاء</button>
            `;
        }

        function saveAccountChanges() {
            let oldName = appData.currentUser.name;
            const newName = document.getElementById('editUserName').value;
            const urlVal = document.getElementById('editUserImgUrl').value;

            if(!newName) { alert("الاسم مطلوب!"); return; }

            handleImageUpload('editUserImgFile', function(base64Img) {
                appData.currentUser.name = newName;
                if(base64Img) appData.currentUser.image = base64Img;
                else if(urlVal) appData.currentUser.image = urlVal;

                // تحديث اسم المستخدم في القصص والرسائل إذا تغير
                if(oldName !== newName) {
                    appData.stories.forEach(s => { if(s.author === oldName) s.author = newName; });
                }

                saveToLocalStorage();
                closeModal();
                renderAccount();
                alert("✅ تم تحديث الحساب بنجاح!");
            });
        }

        function showAccountTab(tab) {
            const container = document.getElementById('accountTabContent');
            if(tab === 'stories') {
                container.innerHTML = `<h3>📚 قصصي</h3><br><div class="stories-grid" id="accStories"></div>`;
                renderMyStoriesList(appData.currentUser.stories, 'accStories');
            } else if(tab === 'favorites') {
                container.innerHTML = `<h3>⭐ القصص المفضلة</h3><br><div class="stories-grid" id="accFav"></div>`;
                renderStoriesList(appData.currentUser.favorites, 'accFav');
            }
        }

        function renderStoriesList(storiesArray, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            let html = "";
            storiesArray.forEach(s => {
                html += `
                    <div class="story-card">
                        <img src="${s.image}" class="story-img-icon" onclick="openStoryDetail(${s.id})">
                        <div class="story-title-click" onclick="openStoryDetail(${s.id})">${s.title}</div>
                        <p style="font-size:12px; opacity:0.7; margin-bottom:10px;">بواسطة: ${s.author}</p>
                        <div style="display:flex; gap:10px; font-size:12px;">
                            <span>⭐ ${s.stars}</span>
                            <span>👍 ${s.likesCount || 0}</span>
                        </div>
                    </div>
                `;
            });
            if(!html) html = "<p>لا توجد قصص للعرض حالياً.</p>";
            grid.innerHTML = html;
        }

        function renderMyStoriesList(storiesArray, gridId) {
            const grid = document.getElementById(gridId);
            if(!grid) return;
            let html = "";
            storiesArray.forEach(s => {
                html += `
                    <div class="story-card">
                        <img src="${s.image}" class="story-img-icon" onclick="openStoryDetail(${s.id})">
                        <div class="story-title-click" onclick="openStoryDetail(${s.id})">${s.title}</div>
                        <div style="display:flex; gap:5px; margin-top:10px;">
                            <button class="btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deleteMyStory(${s.id})">مسح</button>
                        </div>
                    </div>
                `;
            });
            if(!html) html = "<p>لم تقم بنشر أي قصص بعد.</p>";
            grid.innerHTML = html;
        }

        function deleteMyStory(id) {
            if(confirm("هل أنت متأكد من مسح هذه القصة؟")) {
                appData.stories = appData.stories.filter(s => s.id !== id);
                appData.currentUser.stories = appData.currentUser.stories.filter(s => s.id !== id);
                saveToLocalStorage();
                renderAccount();
            }
        }

        // تفاصيل القصة مع التحكم الكامل في اللايك/الديسلايك وقابلية تعديل التقييم
        function openStoryDetail(id) {
            let story = appData.stories.find(s => s.id === id);
            if(!story) return;

            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            let myName = appData.currentUser.name;
            if(!story.likesBy) story.likesBy = [];
            if(!story.dislikesBy) story.dislikesBy = [];
            if(!story.ratings) story.ratings = {};

            let hasLiked = story.likesBy.includes(myName);
            let hasDisliked = story.dislikesBy.includes(myName);
            let userExistingRating = story.ratings[myName]; // عدد النجوم القديم إن وجد

            let ratingButtonHTML = "";
            if(userExistingRating) {
                ratingButtonHTML = `<button class="icon-btn active-action" onclick="openRatingPicker(${story.id})">⭐ تقييمك: ${userExistingRating} / 5 (تعديل)</button>`;
            } else {
                ratingButtonHTML = `<button class="icon-btn" onclick="openRatingPicker(${story.id})">⭐ قيِّم القصة</button>`;
            }

            body.innerHTML = `
                <div style="text-align:center;">
                    <img src="${story.image}" style="width:100px; height:140px; border-radius:8px; object-fit:cover; margin-bottom:10px; border:2px solid var(--border-color);">
                    <h2>${story.title}</h2>
                    <p style="font-size:12px; color:#777; margin-bottom:15px;">الكاتب: ${story.author} | التصنيف: ${story.category}</p>
                </div>
                <div style="background:var(--input-bg); padding:15px; border-radius:8px; max-height:180px; overflow-y:auto; margin-bottom:15px; line-height:1.6;">
                    ${story.text}
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:8px;">
                    <button class="icon-btn ${hasLiked ? 'active-action' : ''}" onclick="toggleLike(${story.id})">👍 إعجاب (${story.likesBy.length})</button>
                    <button class="icon-btn ${hasDisliked ? 'active-action' : ''}" onclick="toggleDislike(${story.id})">👎 لا يعجبني (${story.dislikesBy.length})</button>
                    ${ratingButtonHTML}
                </div>
                <div id="dynamicRatingSection" style="margin-bottom:15px;"></div>
                <button class="icon-btn" style="width:100%; justify-content:center;" onclick="closeModal()">❌ إغلاق</button>
            `;
        }

        // تفاعل الإعجاب (Like) مع تبديل الحالة أو إلغائها
        function toggleLike(id) {
            let story = appData.stories.find(s => s.id === id);
            let myName = appData.currentUser.name;
            if(!story) return;

            if(!story.likesBy) story.likesBy = [];
            if(!story.dislikesBy) story.dislikesBy = [];

            let likedIdx = story.likesBy.indexOf(myName);
            let dislikedIdx = story.dislikesBy.indexOf(myName);

            if(likedIdx > -1) {
                // إذا كان معجب مسبقاً، قم بإلغاء الإعجاب
                story.likesBy.splice(likedIdx, 1);
            } else {
                // إضافته للإعجاب وإزالة أي ديسلايك قديم
                story.likesBy.push(myName);
                if(dislikedIdx > -1) story.dislikesBy.splice(dislikedIdx, 1);
            }

            story.likesCount = story.likesBy.length;
            saveToLocalStorage();
            openStoryDetail(id); // تحديث النافذة فوراً
        }

        // تفاعل عدم الإعجاب (Dislike) مع تبديل الحالة أو إلغائها
        function toggleDislike(id) {
            let story = appData.stories.find(s => s.id === id);
            let myName = appData.currentUser.name;
            if(!story) return;

            if(!story.likesBy) story.likesBy = [];
            if(!story.dislikesBy) story.dislikesBy = [];

            let likedIdx = story.likesBy.indexOf(myName);
            let dislikedIdx = story.dislikesBy.indexOf(myName);

            if(dislikedIdx > -1) {
                // إلغاء الديسلايك إذا كان موجوداً
                story.dislikesBy.splice(dislikedIdx, 1);
            } else {
                // إضافته للديسلايك وإزالة أي إعجاب قديم
                story.dislikesBy.push(myName);
                if(likedIdx > -1) story.likesBy.splice(likedIdx, 1);
            }

            story.likesCount = story.likesBy.length;
            saveToLocalStorage();
            openStoryDetail(id); // تحديث النافذة فوراً
        }

        // فتح شريط التقييم بالنجوم القابل للتعديل
        let selectedStarsCount = 5;
        function openRatingPicker(id) {
            let story = appData.stories.find(s => s.id === id);
            let myName = appData.currentUser.name;
            let currentVal = (story.ratings && story.ratings[myName]) ? story.ratings[myName] : 5;
            selectedStarsCount = currentVal;

            const container = document.getElementById('dynamicRatingSection');
            let starsHTML = "";
            for(let i = 1; i <= 5; i++) {
                let activeClass = i <= currentVal ? 'active' : '';
                starsHTML += `<span class="star ${activeClass}" onclick="setStarValue(${i}, ${id})">★</span>`;
            }

            container.innerHTML = `
                <div style="background:var(--input-bg); padding:12px; border-radius:8px; text-align:center; border:1px solid var(--border-color);">
                    <p style="font-size:13px; margin-bottom:5px; font-weight:bold;">حدد تقييمك (اضغط لتعديل تقييمك القديم):</p>
                    <div class="star-rating-container" id="starsPickerRow">${starsHTML}</div>
                    <button class="btn-primary" style="padding:6px 15px; font-size:13px; margin-top:5px;" onclick="submitRating(${id})">💾 تأكيد التقييم</button>
                </div>
            `;
        }

        // إضاءة النجوم عند الضغط عليها أثناء الاختيار
        function setStarValue(val, id) {
            selectedStarsCount = val;
            const row = document.getElementById('starsPickerRow');
            if(!row) return;
            let stars = row.children;
            for(let i = 0; i < stars.length; i++) {
                if(i < val) stars[i].classList.add('active');
                else stars[i].classList.remove('active');
            }
        }

        // حفظ التقييم واستبدال القديم بالجديد وإعادة حساب المتوسط
        function submitRating(id) {
            let story = appData.stories.find(s => s.id === id);
            let myName = appData.currentUser.name;
            if(!story) return;

            if(!story.ratings) story.ratings = {};

            // استبدال التقييم القديم بالتقييم الجديد تلقائياً
            story.ratings[myName] = selectedStarsCount;

            // حساب المتوسط الجديد لكل التقييمات
            let ratingsValues = Object.values(story.ratings);
            let sum = ratingsValues.reduce((a, b) => a + b, 0);
            let avg = sum / ratingsValues.length;
            story.stars = parseFloat(avg.toFixed(1));

            saveToLocalStorage();
            alert(`✅ تم تحديث تقييمك بنجاح إلى: ${selectedStarsCount} نجوم!`);
            openStoryDetail(id);
        }

        function renderChat() {
            const view = document.getElementById('mainView');
            view.innerHTML = `
                <div class="chat-container">
                    <div class="chat-sidebar" id="chatSidebarList">
                        <div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--border-color);">المحادثات</div>
                    </div>
                    <div class="chat-main">
                        <div class="chat-messages" id="chatMessagesArea"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chatMsgInput" placeholder="اكتب رسالة...">
                            <button class="btn-primary" onclick="sendChatMessage()">إرسال</button>
                        </div>
                    </div>
                </div>
            `;
            renderChatList();
            renderChatMessages(0);
        }

        function renderChatList() {
            const listDiv = document.getElementById('chatSidebarList');
            if(!listDiv) return;
            let html = `<div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--border-color);">المحادثات</div>`;
            appData.chats.forEach((chat, idx) => {
                html += `<div style="padding:12px; border-bottom:1px solid var(--border-color); cursor:pointer;" onclick="renderChatMessages(${idx})">💬 ${chat.name}</div>`;
            });
            listDiv.innerHTML = html;
        }

        let activeChatIdx = 0;
        function renderChatMessages(idx) {
            activeChatIdx = idx;
            const chat = appData.chats[idx];
            const area = document.getElementById('chatMessagesArea');
            if(!area) return;

            let html = "";
            chat.messages.forEach(m => {
                let cls = m.sender === appData.currentUser.name ? 'sent' : 'received';
                html += `
                    <div class="msg ${cls}">
                        <div style="font-size:11px; font-weight:bold; margin-bottom:3px; opacity:0.8;">${m.sender}</div>
                        <div>${m.text}</div>
                    </div>
                `;
            });
            if(!html) html = "<p style='text-align:center; color:#777; margin-top:20px;'>لا توجد رسائل بعد، ابدأ المحادثة الآن!</p>";
            area.innerHTML = html;
            area.scrollTop = area.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatMsgInput');
            if(!input || !input.value.trim()) return;

            appData.chats[activeChatIdx].messages.push({
                sender: appData.currentUser.name,
                text: input.value.trim()
            });
            input.value = "";
            saveToLocalStorage();
            renderChatMessages(activeChatIdx);
        }

        function openFriendsModal() {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            let usersHTML = "";
            appData.usersList.forEach(u => {
                usersHTML += `
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; background:var(--input-bg); padding:8px; border-radius:5px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${u.image}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                            <span>${u.name}</span>
                        </div>
                        <button class="btn-primary" style="padding:5px 10px; font-size:12px;" onclick="addFriend('${u.name}')">➕ إضافة</button>
                    </div>
                `;
            });

            body.innerHTML = `
                <h3>👥 قائمة الأصدقاء المقترحين</h3><br>
                <div style="max-height:250px; overflow-y:auto; margin-bottom:15px;">${usersHTML}</div>
                <button class="icon-btn" style="width:100%; justify-content:center;" onclick="closeModal()">❌ إغلاق</button>
            `;
        }

        function addFriend(name) {
            if(!appData.currentUser.friends.includes(name)) {
                appData.currentUser.friends.push(name);
                saveToLocalStorage();
                alert(`✅ تم إضافة ${name} إلى قائمة أصدقائك!`);
                closeModal();
            } else {
                alert("هذا المستخدم صديقك بالفعل.");
            }
        }
    </script>
</body>
</html>
